        - dictionaryEnabled
      parser: crate::options::parsers::parse_optional_bool
    - type: table_property
      keys:
        - option.dictionary_enabled
        - option.dictionaryEnabled
      parser: crate::options::parsers::parse_optional_bool

- key: dictionary_page_size_limit
  description: |
    (Writing) The best-effort maximum dictionary page size in bytes for the Parquet writer.
    Defaults to the Sail configuration option `parquet.dictionary_page_size_limit`.
  supported: true
  rust_type: usize
  scopes:
    - write
  origins:
    - type: option

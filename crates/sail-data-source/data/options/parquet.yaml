- key: data_page_row_count_limit
  description: |
    (Writing) The best-effort maximum number of rows in a data page.
    The writer checks this limit every 1024 rows, or more often when the limit is smaller than 1024.
    A page can exceed the limit by fewer rows than that interval.
    If the value is `0`, the number of rows in a data page is not limited,
    and only the limit on the size of a data page applies.
    Defaults to the Sail configuration option `parquet.data_page_row_count_limit`.
  supported: true
  rust_type: usize
  scopes:
    - write
  origins:
    - type: option
      keys:
        - data_page_row_count_limit
        - dataPageRowCountLimit
      parser: crate::options::parsers::parse_usize
    - type: table_property
      keys:
        - option.data_page_row_count_limit
        - option.dataPageRowCountLimit
      parser: crate::options::parsers::parse_usize

- key: bloom_filter_on_write
  description: |
    (Writing) Whether to write bloom filters for all columns.
    Defaults to the Sail configuration option `parquet.bloom_filter_on_write`.
  supported: true
  rust_type: bool
  scopes:
    - write
  origins:
    - type: option
      keys:
        - bloom_filter_on_write
        - bloomFilterOnWrite
      parser: crate::options::parsers::parse_bool
    - type: table_property
      keys:
        - option.bloom_filter_on_write
        - option.bloomFilterOnWrite

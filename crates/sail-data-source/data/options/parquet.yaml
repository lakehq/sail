- key: max_row_group_size
  description: |
    (Writing) The target maximum number of rows in each row group for the Parquet writer.
    Larger row groups require more memory to write, but
    can get better compression and be faster to read.
    Defaults to the Sail configuration option `parquet.max_row_group_size`.
  supported: true
  rust_type: usize
  scopes:
    - write
  origins:
    - type: option
      keys:
        - max_row_group_size
        - maxRowGroupSize
      parser: crate::options::parsers::parse_usize
    - type: table_property
      keys:
        - option.max_row_group_size
        - option.maxRowGroupSize
      parser: crate::options::parsers::parse_usize

- key: max_row_group_bytes
  description: |
    (Writing) The target maximum size of each row group in bytes for the Parquet writer.
    When set, the writer flushes a row group when either this limit or `max_row_group_size` is reached,
    whichever comes first.
    Setting this value to `0` means only the row count limit applies.
    Defaults to the Sail configuration option `parquet.max_row_group_bytes`.
  supported: true
  rust_type: "Option<usize>"
  scopes:
    - write
  origins:
    - type: option
      keys:
        - max_row_group_bytes
        - maxRowGroupBytes
      parser: crate::options::parsers::parse_optional_non_zero_usize
    - type: table_property
      keys:
        - option.max_row_group_bytes
        - option.maxRowGroupBytes
      parser: crate::options::parsers::parse_optional_non_zero_usize

- key: column_index_truncate_length
  description: |
    (Writing) The column index truncate length. Setting to 0 disables truncation.
    Defaults to the Sail configuration option `parquet.column_index_truncate_length`.
  supported: true
  rust_type: "Option<usize>"
  scopes:
    - write
  origins:
    - type: option
      keys:
        - column_index_truncate_length
        - columnIndexTruncateLength
      parser: crate::options::parsers::parse_optional_non_zero_usize
    - type: table_property

      parser: crate::options::parsers::parse_bool
    - type: table_property
      keys:
        - option.skip_arrow_metadata
        - option.skipArrowMetadata
      parser: crate::options::parsers::parse_bool

- key: compression
  description: |
    (Writing) The default Parquet compression codec.
    Valid values are `uncompressed`, `snappy`, `gzip(level)`,
    `lzo`, `brotli(level)`, `lz4`, `zstd(level)`, and `lz4_raw`,
    where `level` is an integer defining the compression level.
    These values are not case-sensitive.
    Defaults to the Sail configuration option `parquet.compression`.
  supported: true
  rust_type: "Option<String>"
  scopes:
    - write
  origins:
    - type: option
      keys:
        - compression
        - codec
      parser: crate::options::parsers::parse_optional_string
    - type: table_property
      keys:
        - option.compression
        - option.codec
      parser: crate::options::parsers::parse_optional_string

- key: dictionary_enabled

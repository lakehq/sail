- key: bloom_filter_ndv
  description: |
    (Writing) The number of distinct values for bloom filters.
    If the value is `0`, the Parquet writer uses the maximum number of rows in a row group
    (the `max_row_group_size` option), so the bloom filter is never undersized.
    Defaults to the Sail configuration option `parquet.bloom_filter_ndv`.
  supported: true
  rust_type: "Option<u64>"
  scopes:
    - write
  origins:
    - type: option
      keys:
        - bloom_filter_ndv
        - bloomFilterNdv
      parser: crate::options::parsers::parse_optional_non_zero_u64
    - type: table_property
      keys:
        - option.bloom_filter_ndv
        - option.bloomFilterNdv
      parser: crate::options::parsers::parse_optional_non_zero_u64

- key: encoding_parallelism
  description: |
    (Writing) The maximum number of CPU cores that one write task uses to encode Parquet files.
    A write task writes one partition of the data.
    If the value is `0`, the limit is chosen automatically from the number of CPU cores
    and the number of write tasks that run at the same time.
    If the value is `1`, each write task encodes its files on a single CPU core.
    The content of the files does not depend on this option.
    Defaults to the Sail configuration option `parquet.encoding_parallelism`.
  supported: true
  rust_type: usize
  scopes:
    - write
  origins:
    - type: option
      keys:
        - encoding_parallelism
        - encodingParallelism
      parser: crate::options::parsers::parse_usize

- key: max_open_files_per_task
  description: |
    (Writing) The maximum number of partition directories that one write task writes to
    at the same time when the data is written with partition columns.
    The task keeps one Parquet file open in each of these directories.
    The rows for other partition directories are sorted by their partition directory
    and written after the task has read all its input.
    So the number of files does not depend on this option: each write task writes one file
    per partition directory, unless a limit on the rows or the size of a file is reached.
    A larger value sorts fewer rows and uses more memory, since each open file buffers
    the rows of one row group.
    The sorted rows are kept in memory, or in temporary files when the memory pool has a limit.
    No rows are sorted when the data is already sorted by the partition columns.
    The value must be greater than `0`.
    Defaults to the Sail configuration option `parquet.max_open_files_per_task`.
  supported: true
  rust_type: std::num::NonZeroUsize
  scopes:
    - write
  origins:
    - type: option
      keys:
        - max_open_files_per_task

- name: "vector_norm"
  scope: "sql_builtin"
  group: "vector_funcs"
  source: "built-in"
  class_name: "org.apache.spark.sql.catalyst.expressions.VectorNorm"
  signatures:
    - "vector_norm(vector, degree)"
  usage: |2-
    
        vector_norm(vector, degree) - Returns the Lp norm of a float vector using the specified degree.
        Degree defaults to 2.0 (Euclidean norm) if unspecified. Supported values: 1.0 (L1 norm),
        2.0 (L2 norm), float('inf') (infinity norm).
      
  examples: |2-
    
        Examples:
          > SELECT vector_norm(array(3.0F, 4.0F), 2.0F);
           5.0
          > SELECT vector_norm(array(3.0F, 4.0F), 1.0F);
           7.0
          > SELECT vector_norm(array(3.0F, 4.0F), float('inf'));
           4.0
      
  since: "4.2.0"

- name: "vector_normalize"
  scope: "sql_builtin"
  group: "vector_funcs"
  source: "built-in"
  class_name: "org.apache.spark.sql.catalyst.expressions.VectorNormalize"
  signatures:
    - "vector_normalize(vector, degree)"
  usage: |2-
    
        vector_normalize(vector, degree) - Normalizes a float vector to unit length using the specified norm degree.
        Degree defaults to 2.0 (Euclidean norm) if unspecified. Supported values: 1.0 (L1 norm),
        2.0 (L2 norm), float('inf') (infinity norm).
      
  examples: |2-
    
        Examples:
          > SELECT vector_normalize(array(3.0F, 4.0F), 2.0F);
           [0.6,0.8]
          > SELECT vector_normalize(array(3.0F, 4.0F), 1.0F);
           [0.42857143,0.5714286]
          > SELECT vector_normalize(array(3.0F, 4.0F), float('inf'));
           [0.75,1.0]
      
  since: "4.2.0"

- name: "vector_l2_distance"
  scope: "sql_builtin"
  group: "vector_funcs"
  source: "built-in"
  class_name: "org.apache.spark.sql.catalyst.expressions.VectorL2Distance"
  signatures:
    - "vector_l2_distance(array1, array2)"
  usage: |2-
    
        vector_l2_distance(array1, array2) - Returns the Euclidean (L2) distance between two float vectors.
        The vectors must have the same dimension.
      
  examples: |2-
    
        Examples:
          > SELECT vector_l2_distance(array(1.0F, 2.0F, 3.0F), array(4.0F, 5.0F, 6.0F));

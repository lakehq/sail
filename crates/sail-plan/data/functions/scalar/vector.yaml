- name: "vector_cosine_similarity"
  scope: "sql_builtin"
  group: "vector_funcs"
  source: "built-in"
  class_name: "org.apache.spark.sql.catalyst.expressions.VectorCosineSimilarity"
  signatures:
    - "vector_cosine_similarity(array1, array2)"
  usage: |2-
    
        vector_cosine_similarity(array1, array2) - Returns the cosine similarity between two float vectors.
        The vectors must have the same dimension.
      
  examples: |2-
    
        Examples:
          > SELECT vector_cosine_similarity(array(1.0F, 2.0F, 3.0F), array(4.0F, 5.0F, 6.0F));
           0.9746319
      
  since: "4.2.0"

- name: "vector_inner_product"
  scope: "sql_builtin"
  group: "vector_funcs"
  source: "built-in"

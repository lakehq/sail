syntax = "proto3";

package sail.driver;

message RegisterWorkerRequest {
  uint64 driver_id = 1;
  uint64 worker_id = 2;
  string host = 3;
  uint32 port = 4;
}

message RegisterWorkerResponse {
}

message ReportWorkerHeartbeatRequest {
  uint64 driver_id = 1;
  uint64 worker_id = 2;
}

message ReportWorkerHeartbeatResponse {
}

message ReportWorkerKnownPeersRequest {
  uint64 driver_id = 1;
  uint64 worker_id = 2;
  repeated uint64 peer_worker_ids = 3;
}

message ReportWorkerKnownPeersResponse {
}

message ReportTaskStatusRequest {
  uint64 driver_id = 1;
  uint64 job_id = 2;
  uint64 stage = 3;
  uint64 partition = 4;
  uint64 attempt = 5;
  TaskStatus status = 6;
  // An optional explanation of the task status.
  optional string message = 7;
  // An optional JSON string that contains the cause of the task failure.
  optional string cause = 8;
  uint64 sequence = 101;
}

enum TaskStatus {
  TASK_STATUS_RUNNING = 0;
  TASK_STATUS_SUCCEEDED = 1;
  TASK_STATUS_FAILED = 2;
  TASK_STATUS_CANCELED = 3;
}

message ReportTaskStatusResponse {
}

message ReportMetricsRequest {
  uint64 driver_id = 1;
  // Each entry is an encoded opentelemetry.proto.metrics.v1.ResourceMetrics message.
  repeated bytes metrics = 2;
}

message ReportMetricsResponse {
}

enum StorageAccess {
  STORAGE_ACCESS_READ = 0;
  STORAGE_ACCESS_READ_WRITE = 1;
}

// A request of a worker for the temporary storage credentials that a catalog issued
// for a table in the session of the driver.
message GetStorageCredentialsRequest {
  uint64 driver_id = 1;
  // The value that the driver sent to its workers with the storage routes.
  bytes token = 2;
  string owner = 3;
  string location = 4;
  StorageAccess access = 5;
}

message GetStorageCredentialsResponse {
  oneof credential {
    S3StorageCredential s3 = 1;
    // An S3-compatible storage that is accessed with the credentials of the environment.
    S3StorageEndpoint s3_environment = 2;
    AzureSasStorageCredential azure_sas = 3;
    GcsOauthStorageCredential gcs_oauth = 4;
  }
  // The time when the credential expires, in milliseconds since the Unix epoch.
  optional int64 expires_at_ms = 5;
}

message S3StorageCredential {
  string access_key_id = 1;
  string secret_access_key = 2;
  optional string session_token = 3;
  // The storage that the credential is for, if it is not AWS S3.
  optional S3StorageEndpoint endpoint = 4;
}

message S3StorageEndpoint {
  string url = 1;
  optional string region = 2;
}

message AzureSasStorageCredential {
  string token = 1;
}

message GcsOauthStorageCredential {
  string token = 1;
}

service DriverService {
  rpc RegisterWorker(RegisterWorkerRequest) returns (RegisterWorkerResponse) {}
  rpc ReportWorkerHeartbeat(ReportWorkerHeartbeatRequest) returns (ReportWorkerHeartbeatResponse) {}
  // Report the peers known to the worker so that the driver does not need to
  // send the peer information to the worker again when running tasks in the future.
  rpc ReportWorkerKnownPeers(ReportWorkerKnownPeersRequest) returns (ReportWorkerKnownPeersResponse) {}
  rpc ReportTaskStatus(ReportTaskStatusRequest) returns (ReportTaskStatusResponse) {}
  rpc ReportMetrics(ReportMetricsRequest) returns (ReportMetricsResponse) {}
  // Get the storage credentials for a storage route that the worker received with a task batch.
  // The credentials are only sent in the response to this request, and are not part of any plan.
  rpc GetStorageCredentials(GetStorageCredentialsRequest) returns (GetStorageCredentialsResponse) {}
}

syntax = "proto3";

package sail.stream;

// A ticket for the streams of the given channels of the given tasks of a stage.
// Each task has an entry in `partition` and an entry at the same position in `attempt`.
// A reader fetches all these streams in one request and receives their data in
// arbitrary order.
message TaskStreamTicket {
  uint64 job_id = 1;
  uint64 stage = 2;
  repeated uint64 partition = 3;
  repeated uint64 attempt = 4;
  repeated uint64 channel = 5;
  // Whether the reader releases the streams, which it will not read.
  // It receives no data.
  bool release = 6;
}

message DriverTaskStreamTicket {
  uint64 driver_id = 1;
  TaskStreamTicket stream = 2;
}

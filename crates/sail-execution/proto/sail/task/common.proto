syntax = "proto3";

package sail.task;

message TaskDefinition {
  bytes plan = 1;
  repeated TaskInput inputs = 2;
  TaskOutput output = 3;
}

message TaskInput {
  uint64 stage = 1;
  TaskInputLocator locator = 2;
}

message TaskInputLocator {
  oneof Kind {
    TaskInputDriverLocator driver = 1;
    TaskInputWorkerLocator worker = 2;
    TaskInputStorageLocator storage = 3;
    TaskInputShuffleServiceLocator shuffle_service = 4;
  }
}

message TaskInputDriverLocator {
  repeated TaskInputDriverKeyList keys = 1;
}

message TaskInputDriverKey {
  uint64 partition = 2;
  uint64 attempt = 3;
  uint64 channel = 4;
}

message TaskInputDriverKeyList {
  repeated TaskInputDriverKey keys = 1;
}

message TaskInputWorkerLocator {
  repeated TaskInputWorkerKeyList keys = 1;
}

message TaskInputWorkerKey {
  uint64 worker_id = 1;
  uint64 partition = 2;
  uint64 attempt = 3;
  uint64 channel = 4;
}

message TaskInputWorkerKeyList {
  repeated TaskInputWorkerKey keys = 1;
}

message TaskInputStorageLocator {
  repeated TaskInputRemoteKeyList keys = 1;
}

message TaskInputShuffleServiceLocator {
  repeated TaskInputChannelList channels = 1;
}

message TaskInputChannelList {
  repeated uint64 channels = 1;
}

message TaskInputRemoteKey {
  uint64 partition = 1;
  uint64 attempt = 2;
  uint64 channel = 3;
}

message TaskInputRemoteKeyList {
  repeated TaskInputRemoteKey keys = 1;
}

message TaskOutput {
  TaskOutputDistribution distribution = 1;
  TaskOutputLocator locator = 2;
}

message TaskOutputDistribution {
  oneof Kind {
    TaskOutputHashDistribution hash = 1;
    TaskOutputRoundRobinDistribution round_robin = 2;
    TaskOutputRoundRobinRowDistribution round_robin_row = 3;
  }
}

message TaskOutputHashDistribution {
  repeated bytes keys = 1;
  uint64 channels = 2;
}

message TaskOutputRoundRobinDistribution {
  uint64 channels = 1;
}

message TaskOutputRoundRobinRowDistribution {
  uint64 channels = 1;
}

message TaskOutputLocator {
  oneof Kind {
    TaskOutputPipelinedLocator pipelined = 1;
    TaskOutputBlockingLocator blocking = 2;
  }
}

message TaskOutputPipelinedLocator {
  uint64 replicas = 1;
}

message TaskOutputBlockingLocator {
}

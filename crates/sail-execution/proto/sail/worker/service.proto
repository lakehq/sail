syntax = "proto3";

package sail.worker;

message WorkerLocation {
  uint64 worker_id = 1;
  string host = 2;
  uint32 port = 3;
}

message TaskAttempt {
  uint64 partition = 1;
  uint64 attempt = 2;
}

// A storage location that the worker accesses in the same way as the session of the driver.
message StorageRoute {
  string location = 1;
  // The table that the storage credentials are issued for.
  string owner = 2;
  // The version of the routes in which the route was added. The worker replaces
  // the object stores of a route that the driver added again.
  uint64 version = 3;
  // The reason why no storage credentials are issued for the owner, in which case
  // the location is accessed with the storage credentials of the environment.
  optional string not_issued = 4;
}

// The storage locations that the worker accesses with the storage credentials
// that it requests from the driver. There are no storage credentials here.
message StorageRoutes {
  // The worker ignores the routes if it has the routes of this or a later version.
  uint64 version = 1;
  // The value to send to the driver when requesting storage credentials.
  bytes token = 2;
  repeated StorageRoute routes = 3;
}

// Accepts all tasks together. Tasks share a stage and belong to one task region.
// Completion is reported separately for each task attempt.
message RunTaskBatchRequest {
  uint64 job_id = 1;
  uint64 stage = 2;
  repeated TaskAttempt tasks = 3;
  bytes definition = 5;
  // The locations of peer workers that may or may not be needed
  // when fetching streams for this task.
  // Note that we should not broadcast peer information to workers
  // asynchronously because the requests may arrive out of order.
  // However, the worker can asynchronously acknowledge the receipt
  // of peer information to the driver so that duplicate peer
  // information does not need to be sent again in the future.
  repeated WorkerLocation peers = 6;
  // The storage routes of the session, if it has any.
  optional StorageRoutes storage_routes = 7;
}

message RunTaskBatchResponse {
}

message StopTaskRequest {
  uint64 job_id = 1;
  uint64 stage = 2;
  uint64 partition = 3;
  uint64 attempt = 4;
}

message StopTaskResponse {
}

message CleanUpJobRequest {
  uint64 job_id = 1;
  // An optional stage to clean up.
  // If not specified, clean up all stages for the job.
  optional uint64 stage = 2;
}

message CleanUpJobResponse {
}

message StopWorkerRequest {
}

message StopWorkerResponse {
}

service WorkerService {
  rpc RunTaskBatch(RunTaskBatchRequest) returns (RunTaskBatchResponse) {}
  rpc StopTask(StopTaskRequest) returns (StopTaskResponse) {}
  rpc CleanUpJob(CleanUpJobRequest) returns (CleanUpJobResponse) {}
  rpc StopWorker(StopWorkerRequest) returns (StopWorkerResponse) {}
}

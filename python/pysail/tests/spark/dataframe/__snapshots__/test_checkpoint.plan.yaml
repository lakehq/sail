---
name: "test_checkpoint_supports_iterative_weakly_connected_components"
data:
  |-
    == Physical Plan ==
    ProjectionExec: expr=[#36@0 as node, #37@1 as label]
      ProjectionExec: expr=[#0@0 as #36, least(#1@1, CASE WHEN #30@2 IS NOT NULL THEN #30@2 ELSE #1@1 END) as #37]
        HashJoinExec: mode=CollectLeft, join_type=Left, on=[(#0@0, #29@0)], projection=[#0@0, #1@1, #30@3]
          CoalescePartitionsExec
            DataSourceExec: file_groups={4 groups: <checkpoint files>}, projection=[_c0@0 as #0, _c1@1 as #1], file_type=parquet
          ProjectionExec: expr=[#25@0 as #29, #26@1 as #30]
            AggregateExec: mode=FinalPartitioned, gby=[#25@0 as #25], aggr=[min(#22) as #26]
              RepartitionExec: partitioning=Hash([#25@0], 4), input_partitions=4
                AggregateExec: mode=Partial, gby=[#21@0 as #25], aggr=[min(#22) as #26]
                  RepartitionExec: partitioning=RoundRobinBatch(4), input_partitions=2
                    ProjectionExec: expr=[#10@0 as #21, #19@1 as #22]
                      HashJoinExec: mode=CollectLeft, join_type=Inner, on=[(#18@0, #11@1)], projection=[#10@2, #19@1]
                        CoalescePartitionsExec
                          ProjectionExec: expr=[#16@0 as #18, #17@1 as #19]
                            DataSourceExec: file_groups={4 groups: <checkpoint files>}, projection=[_c0@0 as #16, _c1@1 as #17], file_type=parquet
                        UnionExec
                          ProjectionExec: expr=[a@0 as #10, b@1 as #11]
                            DataSourceExec: partitions=1, partition_sizes=[1]
                          ProjectionExec: expr=[b@1 as #10, a@0 as #11]
                            DataSourceExec: partitions=1, partition_sizes=[1]

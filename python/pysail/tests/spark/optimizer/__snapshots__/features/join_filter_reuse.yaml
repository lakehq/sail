    == Physical Plan ==
    ProjectionExec: expr=[#5@0 as item_sk, #6@1 as total, #7@2 as n]
      ProjectionExec: expr=[#0@0 as #5, sum(s.#4)@1 as #6, count(Int64(1))@2 as #7]
        AggregateExec: mode=FinalPartitioned, gby=[#0@0 as #0], aggr=[sum(s.#4), count(Int64(1))]
          RepartitionExec: partitioning=Hash([#0@0], 4), input_partitions=4
            AggregateExec: mode=Partial, gby=[#0@0 as #0], aggr=[sum(s.#4), count(Int64(1))]
              HashJoinExec: mode=CollectLeft, join_type=Inner, on=[(#0@0, #3@0)], projection=[#0@0, #4@2]
                CoalescePartitionsExec
                  ProjectionExec: expr=[item_sk@0 as #0]

                            RepartitionExec: partitioning=Hash([#0@0], 4), input_partitions=4
                              AggregateExec: mode=Partial, gby=[#0@0 as #0], aggr=[sum(a.#2)]
                                RepartitionExec: partitioning=RoundRobinBatch(4), input_partitions=1

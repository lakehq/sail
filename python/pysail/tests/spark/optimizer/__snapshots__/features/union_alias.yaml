# serializer version: 1
---
name: "test_anonymous_union_aliases_preserve_column_values"
data:
  |-
    == Physical Plan ==
    ProjectionExec: expr=[#4@0 as n]
      ProjectionExec: expr=[sum(__auto_generated_subquery_name.#1)@0 as #4]
        AggregateExec: mode=Final, gby=[], aggr=[sum(__auto_generated_subquery_name.#1)]
          CoalescePartitionsExec
            AggregateExec: mode=Partial, gby=[], aggr=[sum(__auto_generated_subquery_name.#1)]
              UnionExec
                ProjectionExec: expr=[id@0 as #1]
                  RangeExec: start=0, end=1000, step=1, num_partitions=1, projection=[0]
                ProjectionExec: expr=[id@0 as #1]
                  RangeExec: start=0, end=1000, step=1, num_partitions=1, projection=[0]
---
name: "test_nested_anonymous_derived_tables_add_no_alias_layers"
data:
  |-
    == Parsed Logical Plan ==
    Projection: __auto_generated_subquery_name.#6 AS #7
      Projection: __auto_generated_subquery_name.#4 AS #6
        Projection: __auto_generated_subquery_name.#2 AS #4
          Projection: range.#0 AS x AS #2
            Projection: range.id AS #0
              TableScan: range

    == Analyzed Logical Plan ==
    #7: Int64
    Projection: __auto_generated_subquery_name.#6 AS #7
      Projection: __auto_generated_subquery_name.#4 AS #6
        Projection: __auto_generated_subquery_name.#2 AS #4
          Projection: range.#0 AS x AS #2
            Projection: range.id AS #0
              TableScan: range

    == Optimized Logical Plan ==
    Projection: range.id AS #7
      TableScan: range projection=[id]

    == Physical Plan ==
    ProjectionExec: expr=[#7@0 as x]
      ProjectionExec: expr=[id@0 as #7]
        CooperativeExec
          RangeExec: start=0, end=3, step=1, num_partitions=1, projection=[0]

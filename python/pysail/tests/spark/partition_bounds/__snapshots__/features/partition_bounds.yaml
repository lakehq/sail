# serializer version: 1
---
name: "test_a_partition_filter_driven_by_a_scalar_subquery_still_scans_every_file"
data:
  |-
    == Physical Plan ==
    ProjectionExec: expr=[#5@0 as count(1)]
      ScalarSubqueryExec: subqueries=1
        ProjectionExec: expr=[count(Int64(1))@0 as #5]
          AggregateExec: mode=Final, gby=[], aggr=[count(Int64(1))]
            CoalescePartitionsExec
              AggregateExec: mode=Partial, gby=[], aggr=[count(Int64(1))]
                FilterExec: dt@0 = scalar_subquery(<pending>), projection=[]
                  DataSourceExec: file_groups={4 groups: [[<tmp>/partition_bounds_flat/dt=2025-10-01/<id>.zst.parquet], [<tmp>/partition_bounds_flat/dt=2025-10-02/<id>.zst.parquet], [<tmp>/partition_bounds_flat/dt=2025-10-03/<id>.zst.parquet], [<tmp>/partition_bounds_flat/dt=2025-10-04/<id>.zst.parquet]]}, projection=[dt], file_type=parquet, predicate=dt@1 = scalar_subquery(<pending>), pruning_predicate=dt_null_count@2 != row_count@3 AND dt_min@0 <= scalar_subquery(<pending>) AND scalar_subquery(<pending>) <= dt_max@1, required_guarantees=[]
        ProjectionExec: expr=[2025-10-04 as #4]
          PlaceholderRowExec
---
name: "test_a_range_filter_on_the_partition_column_is_not_a_pinned_prefix"
data:
  |-
    == Physical Plan ==
    ProjectionExec: expr=[#2@0 as max(dt)]
      ProjectionExec: expr=[max(partition_bounds_flat.#1)@0 as #2]
        AggregateExec: mode=Final, gby=[], aggr=[max(partition_bounds_flat.#1)]
          CoalescePartitionsExec
            AggregateExec: mode=Partial, gby=[], aggr=[max(partition_bounds_flat.#1)]
              RepartitionExec: partitioning=RoundRobinBatch(4), input_partitions=3
                DataSourceExec: file_groups={3 groups: [[<tmp>/partition_bounds_flat/dt=2025-10-02/<id>.zst.parquet], [<tmp>/partition_bounds_flat/dt=2025-10-03/<id>.zst.parquet], [<tmp>/partition_bounds_flat/dt=2025-10-04/<id>.zst.parquet]]}, projection=[dt@1 as #1], file_type=parquet, predicate=DynamicFilter [ empty ]
---
name: "test_a_window_function_over_the_partition_column_still_scans_every_file"
data:
  |-
    == Physical Plan ==
    ProjectionExec: expr=[#5@0 as dt]
      ProjectionExec: expr=[#1@0 as #5]
        FilterExec: rank() ORDER BY [partition_bounds_flat.#1 DESC NULLS LAST] RANGE BETWEEN UNBOUNDED PRECEDING AND CURRENT ROW@1 = 1, projection=[#1@0]
          RepartitionExec: partitioning=RoundRobinBatch(4), input_partitions=1, maintains_sort_order=true
            BoundedWindowAggExec: wdw=[rank() ORDER BY [partition_bounds_flat.#1 DESC NULLS LAST] RANGE BETWEEN UNBOUNDED PRECEDING AND CURRENT ROW: Field { "rank() ORDER BY [partition_bounds_flat.#1 DESC NULLS LAST] RANGE BETWEEN UNBOUNDED PRECEDING AND CURRENT ROW": UInt64 }, frame: RANGE BETWEEN UNBOUNDED PRECEDING AND CURRENT ROW], mode=[Sorted]
              SortPreservingMergeExec: [#1@0 DESC NULLS LAST]
                SortExec: expr=[#1@0 DESC NULLS LAST], preserve_partitioning=[true]
                  DataSourceExec: file_groups={4 groups: [[<tmp>/partition_bounds_flat/dt=2025-10-01/<id>.zst.parquet], [<tmp>/partition_bounds_flat/dt=2025-10-02/<id>.zst.parquet], [<tmp>/partition_bounds_flat/dt=2025-10-03/<id>.zst.parquet], [<tmp>/partition_bounds_flat/dt=2025-10-04/<id>.zst.parquet]]}, projection=[dt@1 as #1], file_type=parquet
---
name: "test_max_over_a_data_column_still_scans_every_file"
data:
  |-
    == Physical Plan ==
    ProjectionExec: expr=[#2@0 as max(id)]
      ProjectionExec: expr=[max(partition_bounds_flat.#0)@0 as #2]
        AggregateExec: mode=Final, gby=[], aggr=[max(partition_bounds_flat.#0)]
          CoalescePartitionsExec
            AggregateExec: mode=Partial, gby=[], aggr=[max(partition_bounds_flat.#0)]
              DataSourceExec: file_groups={4 groups: [[<tmp>/partition_bounds_flat/dt=2025-10-01/<id>.zst.parquet], [<tmp>/partition_bounds_flat/dt=2025-10-02/<id>.zst.parquet], [<tmp>/partition_bounds_flat/dt=2025-10-03/<id>.zst.parquet], [<tmp>/partition_bounds_flat/dt=2025-10-04/<id>.zst.parquet]]}, projection=[id@0 as #0], file_type=parquet, predicate=DynamicFilter [ empty ]
---
name: "test_max_over_the_partition_column"
data:
  |-
    == Physical Plan ==
    ProjectionExec: expr=[#2@0 as max(dt)]
      ProjectionExec: expr=[2025-10-04 as #2]
        PlaceholderRowExec
---
name: "test_min_and_max_in_the_same_aggregate"
data:
  |-
    == Physical Plan ==
    ProjectionExec: expr=[#2@0 as min(dt), #3@1 as max(dt)]
      ProjectionExec: expr=[2025-10-01 as #2, 2025-10-04 as #3]
        PlaceholderRowExec

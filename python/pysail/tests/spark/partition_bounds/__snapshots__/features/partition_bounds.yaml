name: "test_a_window_function_over_the_partition_column_still_scans_every_file"
data:
  |-
    == Physical Plan ==
    ProjectionExec: expr=[#7@0 as dt]
      ProjectionExec: expr=[#1@0 as #7]
        FilterExec: rank() ORDER BY [partition_bounds_flat.#1 DESC NULLS LAST] RANGE BETWEEN UNBOUNDED PRECEDING AND CURRENT ROW@1 = 1, projection=[#1@0]
          RepartitionExec: partitioning=RoundRobinBatch(4), input_partitions=1, maintains_sort_order=true
            BoundedWindowAggExec: wdw=[rank() ORDER BY [partition_bounds_flat.#1 DESC NULLS LAST] RANGE BETWEEN UNBOUNDED PRECEDING AND CURRENT ROW: Field { "rank() ORDER BY [partition_bounds_flat.#1 DESC NULLS LAST] RANGE BETWEEN UNBOUNDED PRECEDING AND CURRENT ROW": UInt64 }, frame: RANGE BETWEEN UNBOUNDED PRECEDING AND CURRENT ROW], mode=[Sorted]
              SortPreservingMergeExec: [#1@0 DESC NULLS LAST]
                ProjectionExec: expr=[dt@0 as #1]
                  SortExec: expr=[dt@0 DESC NULLS LAST], preserve_partitioning=[true]
                    DataSourceExec: file_groups={1 group: [[<tmp>/partition_bounds_flat/dt=2025-10-01/<id>.zst.parquet:<range>, <tmp>/partition_bounds_flat/dt=2025-10-02/<id>.zst.parquet:<range>, <tmp>/partition_bounds_flat/dt=2025-10-03/<id>.zst.parquet:<range>, <tmp>/partition_bounds_flat/dt=2025-10-04/<id>.zst.parquet:<range>]]}, projection=[dt], file_type=parquet

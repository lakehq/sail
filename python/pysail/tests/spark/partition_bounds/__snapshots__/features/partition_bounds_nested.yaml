# serializer version: 1
---
name: "test_a_deeper_level_without_any_filter_still_scans_every_file"
data:
  |-
    == Physical Plan ==
    ProjectionExec: expr=[#4@0 as max(day)]
      ProjectionExec: expr=[max(partition_bounds_nested.#3)@0 as #4]
        AggregateExec: mode=Final, gby=[], aggr=[max(partition_bounds_nested.#3)]
          CoalescePartitionsExec
            AggregateExec: mode=Partial, gby=[], aggr=[max(partition_bounds_nested.#3)]
              DataSourceExec: file_groups={4 groups: [[<tmp>/partition_bounds_nested/year=2024/month=12/day=31/<id>.zst.parquet], [<tmp>/partition_bounds_nested/year=2025/month=03/day=07/<id>.zst.parquet], [<tmp>/partition_bounds_nested/year=2025/month=10/day=01/<id>.zst.parquet], [<tmp>/partition_bounds_nested/year=2025/month=10/day=04/<id>.zst.parquet]]}, projection=[day@3 as #3], file_type=parquet, predicate=DynamicFilter [ empty ]
---
name: "test_a_middle_level_with_only_its_parent_pinned"
data:
  |-
    == Physical Plan ==
    ProjectionExec: expr=[#4@0 as max(month)]
      ProjectionExec: expr=[10 as #4]
        PlaceholderRowExec
---
name: "test_a_partially_pinned_prefix_still_scans_every_file"
data:
  |-
    == Physical Plan ==
    ProjectionExec: expr=[#4@0 as max(day)]
      ProjectionExec: expr=[max(partition_bounds_nested.#3)@0 as #4]
        AggregateExec: mode=Final, gby=[], aggr=[max(partition_bounds_nested.#3)]
          CoalescePartitionsExec
            AggregateExec: mode=Partial, gby=[], aggr=[max(partition_bounds_nested.#3)]
              RepartitionExec: partitioning=RoundRobinBatch(4), input_partitions=3
                DataSourceExec: file_groups={3 groups: [[<tmp>/partition_bounds_nested/year=2025/month=03/day=07/<id>.zst.parquet], [<tmp>/partition_bounds_nested/year=2025/month=10/day=01/<id>.zst.parquet], [<tmp>/partition_bounds_nested/year=2025/month=10/day=04/<id>.zst.parquet]]}, projection=[day@3 as #3], file_type=parquet, predicate=DynamicFilter [ empty ]
---
name: "test_the_deepest_level_with_both_ancestors_pinned"
data:
  |-
    == Physical Plan ==
    ProjectionExec: expr=[#4@0 as max(day)]
      ProjectionExec: expr=[04 as #4]
        PlaceholderRowExec
---
name: "test_the_leading_level_needs_no_filter"
data:
  |-
    == Physical Plan ==
    ProjectionExec: expr=[#4@0 as max(year)]
      ProjectionExec: expr=[2025 as #4]
        PlaceholderRowExec
---
name: "test_the_pinned_ancestors_become_the_prefix_of_the_partitionbounds_node"
data:
  |-
    == Parsed Logical Plan ==
    Projection: max(partition_bounds_nested.#3) AS #4
      Aggregate: groupBy=[[]], aggr=[[max(partition_bounds_nested.#3)]]
        Filter: partition_bounds_nested.#1 = Utf8("2025") AND partition_bounds_nested.#2 = Utf8("10")
          Projection: partition_bounds_nested.id AS #0, partition_bounds_nested.year AS #1, partition_bounds_nested.month AS #2, partition_bounds_nested.day AS #3
            TableScan: partition_bounds_nested
  
    == Analyzed Logical Plan ==
    #4: Utf8
    Projection: max(partition_bounds_nested.#3) AS #4
      Aggregate: groupBy=[[]], aggr=[[max(partition_bounds_nested.#3)]]
        Filter: partition_bounds_nested.#1 = Utf8("2025") AND partition_bounds_nested.#2 = Utf8("10")
          Projection: partition_bounds_nested.id AS #0, partition_bounds_nested.year AS #1, partition_bounds_nested.month AS #2, partition_bounds_nested.day AS #3
            TableScan: partition_bounds_nested
  
    == Optimized Logical Plan ==
    Projection: max(partition_bounds_nested.#3) AS #4
      PartitionBounds: column=day, bounds=[Max], path=file://<tmp>/partition_bounds_nested/, prefix=year=2025/month=10
  
    == Physical Plan ==
    ProjectionExec: expr=[#4@0 as max(day)]
      ProjectionExec: expr=[04 as #4]
        PlaceholderRowExec

name: "test_filtered_limit_keeps_later_matches_and_projection[False]"
data:
  filtered: |-
    == Physical Plan ==
    ProjectionExec: expr=[#2@0 as id]
      ProjectionExec: expr=[id@0 as #2]
        CoalescePartitionsExec: fetch=1
          FilterExec: p@1 = 1, projection=[id@0], fetch=1
            RepartitionExec: partitioning=RoundRobinBatch(4), input_partitions=1
              DataSourceExec: file_groups={1 group: [[<tmp>/warehouse/default/filtered_limit/data/00000-0-<uuid>.parquet, <tmp>/warehouse/default/filtered_limit/data/00000-0-<uuid>.parquet, <tmp>/warehouse/default/filtered_limit/data/00000-0-<uuid>.parquet]]}, projection=[id, p], file_type=parquet, predicate=p@1 = 1, pruning_predicate=p_null_count@2 != row_count@3 AND p_min@0 <= 1 AND 1 <= p_max@1, required_guarantees=[p in (1)]
  offset: |-
    == Physical Plan ==
    ProjectionExec: expr=[#0@0 as id, #1@1 as p]
      ProjectionExec: expr=[id@0 as #0, p@1 as #1]
        GlobalLimitExec: skip=1, fetch=1
          SortExec: TopK(fetch=2), expr=[id@0 ASC], preserve_partitioning=[false]
            DataSourceExec: file_groups={1 group: [[<tmp>/warehouse/default/filtered_limit/data/00000-0-<uuid>.parquet, <tmp>/warehouse/default/filtered_limit/data/00000-0-<uuid>.parquet, <tmp>/warehouse/default/filtered_limit/data/00000-0-<uuid>.parquet]]}, projection=[id, p], file_type=parquet, predicate=DynamicFilter [ empty ], sort_order_for_reorder=[id@0 ASC], dynamic_rg_pruning=eligible
---
name: "test_filtered_limit_keeps_later_matches_and_projection[True]"
data:
  filtered: |-
    == Physical Plan ==
    ProjectionExec: expr=[#2@0 as id]
      CoalescePartitionsExec: fetch=1
        ProjectionExec: expr=[id@0 as #2]
          FilterExec: p@1 = 1, projection=[id@0], fetch=1
            IcebergScanByDataFilesExec: table_url=file://<table_url>
              IcebergDiscoveryExec: table_url=file://<table_url>, snapshot_id=<snapshot_id>, partition_scan=false
                RepartitionExec: partitioning=RoundRobinBatch(4), input_partitions=1
                  IcebergManifestScanExec: table_url=file://<table_url>, snapshot_id=<snapshot_id>
  offset: |-
    == Physical Plan ==
    ProjectionExec: expr=[#0@0 as id, #1@1 as p]
      GlobalLimitExec: skip=1, fetch=1
        SortPreservingMergeExec: [#0@0 ASC], fetch=2
          ProjectionExec: expr=[id@0 as #0, p@1 as #1]
            SortExec: TopK(fetch=2), expr=[id@0 ASC], preserve_partitioning=[true]
              IcebergScanByDataFilesExec: table_url=file://<table_url>
                IcebergDiscoveryExec: table_url=file://<table_url>, snapshot_id=<snapshot_id>, partition_scan=false
                  RepartitionExec: partitioning=RoundRobinBatch(4), input_partitions=1
                    IcebergManifestScanExec: table_url=file://<table_url>, snapshot_id=<snapshot_id>
---
name: "test_identity_grouping_and_distinct_use_partition_metadata"
data:
  distinct: |-
    == Physical Plan ==
    ProjectionExec: expr=[#2@0 as p]
      AggregateExec: mode=FinalPartitioned, gby=[#2@0 as #2], aggr=[]
        RepartitionExec: partitioning=Hash([#2@0], 4), input_partitions=3
          AggregateExec: mode=Partial, gby=[#2@0 as #2], aggr=[], ordering_mode=Sorted
            ProjectionExec: expr=[p@0 as #2]
              IcebergMetadataScanExec
                UnionExec
                  ProjectionExec: expr=[NULL as p]
                    RangeExec
                  ProjectionExec: expr=[CAST(a AS Utf8) as p]
                    RangeExec
                  ProjectionExec: expr=[CAST(b AS Utf8) as p]
                    RangeExec
  grouped: |-
    == Physical Plan ==
    ProjectionExec: expr=[#2@0 as p, #3@1 as count]
      ProjectionExec: expr=[#1@0 as #2, count(Int64(1))@1 as #3]
        AggregateExec: mode=FinalPartitioned, gby=[#1@0 as #1], aggr=[count(Int64(1))]
          RepartitionExec: partitioning=Hash([#1@0], 4), input_partitions=3
            AggregateExec: mode=Partial, gby=[#1@0 as #1], aggr=[count(Int64(1))], ordering_mode=Sorted
              ProjectionExec: expr=[p@0 as #1]
                IcebergMetadataScanExec
                  UnionExec
                    ProjectionExec: expr=[NULL as p]
                      RangeExec
                    ProjectionExec: expr=[CAST(a AS Utf8) as p]
                      RangeExec
                    ProjectionExec: expr=[CAST(b AS Utf8) as p]
                      RangeExec

            AggregateExec: mode=Partial, gby=[__sail_attribute_2@0 as __sail_attribute_3], aggr=[count(1) as __sail_attribute_4], ordering_mode=Sorted
              ProjectionExec: expr=[category@0 as __sail_attribute_2]
                IcebergMetadataScanExec
                  UnionExec

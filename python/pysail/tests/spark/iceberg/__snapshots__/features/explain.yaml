# serializer version: 1
---
name: "test_exact_and_residual_aggregates_share_iceberg_file_selection"
data:
  |-
    == Physical Plan ==
    ProjectionExec: expr=[#2@0 as count(1), #3@1 as count(value), #4@2 as MIN(id), #5@3 as MAX(id)]
      ProjectionExec: expr=[3 as #2, 2 as #3, 1 as #4, 3 as #5]
        PlaceholderRowExec
---
name: "test_exact_and_residual_aggregates_share_iceberg_file_selection.1"
data:
  |-
    == Physical Plan ==
    ProjectionExec: expr=[#2@0 as rows, #3@1 as minimum, #4@2 as total]
      ProjectionExec: expr=[3 as #2, 1 as #3, __sail_residual_aggregate_2@0 as #4]
        AggregateExec: mode=Single, gby=[], aggr=[sum(agg_table.#1) as __sail_residual_aggregate_2]
          DataSourceExec: file_groups={1 group: [[<tmp>/iceberg_explain_agg/data/part-<uuid>-00000000000000000000.parquet]]}, projection=[value@1 as #1], file_type=parquet
---
name: "test_explain_for_andor_predicates"
data:
  |-
    == Physical Plan ==
    ProjectionExec: expr=[#3@0 as id, #4@1 as status, #5@2 as value]
      ProjectionExec: expr=[id@0 as #3, status@1 as #4, value@2 as #5]
        FilterExec: status@1 = active AND value@2 > 150 OR id@0 = 2
          RepartitionExec: partitioning=RoundRobinBatch(4), input_partitions=1
            DataSourceExec: file_groups={1 group: [[<tmp>/iceberg_explain_filter/data/part-<uuid>-00000000000000000000.parquet]]}, projection=[id, status, value], file_type=parquet, predicate=status@1 = active AND value@2 > 150 OR id@0 = 2, pruning_predicate=status_null_count@2 != row_count@3 AND status_min@0 <= active AND active <= status_max@1 AND value_null_count@5 != row_count@3 AND value_max@4 > 150 OR id_null_count@8 != row_count@3 AND id_min@6 <= 2 AND 2 <= id_max@7, required_guarantees=[]
---
name: "test_explain_for_count_aggregation"
data:
  |-
    == Physical Plan ==
    ProjectionExec: expr=[#3@0 as category, #4@1 as cnt]
      ProjectionExec: expr=[#2@0 as #3, count(Int64(1))@1 as #4]
        AggregateExec: mode=FinalPartitioned, gby=[#2@0 as #2], aggr=[count(Int64(1))]
          RepartitionExec: partitioning=Hash([#2@0], 4), input_partitions=2
            AggregateExec: mode=Partial, gby=[#2@0 as #2], aggr=[count(Int64(1))], ordering_mode=Sorted
              ProjectionExec: expr=[category@0 as #2]
                IcebergMetadataScanExec
                  UnionExec
                    ProjectionExec: expr=[1 as category]
                      RangeExec: start=0, end=2, step=1, num_partitions=1, projection=[]
                    ProjectionExec: expr=[2 as category]
                      RangeExec: start=0, end=2, step=1, num_partitions=1, projection=[]
---
name: "test_explain_for_join_between_two_iceberg_tables"
data:
  |-
    == Physical Plan ==
    ProjectionExec: expr=[#4@0 as name, #5@1 as value]
      ProjectionExec: expr=[#1@0 as #4, #3@1 as #5]
        HashJoinExec: mode=CollectLeft, join_type=Inner, on=[(#2@0, #0@0)], projection=[#1@3, #3@1]
          DataSourceExec: file_groups={1 group: [[<tmp>/iceberg_explain_join_right/data/part-<uuid>-00000000000000000000.parquet]]}, projection=[id@0 as #2, value@1 as #3], file_type=parquet
          DataSourceExec: file_groups={1 group: [[<tmp>/iceberg_explain_join_left/data/part-<uuid>-00000000000000000000.parquet]]}, projection=[id@0 as #0, name@1 as #1], file_type=parquet, predicate=DynamicFilter [ empty ], dynamic_rg_pruning=eligible
---
name: "test_explain_for_order_by_on_partitioned_table"
data:
  |-
    == Physical Plan ==
    ProjectionExec: expr=[#3@0 as id, #4@1 as name, #5@2 as partition_col]
      SortPreservingMergeExec: [#5@2 ASC, #3@0 ASC]
        ProjectionExec: expr=[id@0 as #3, name@1 as #4, partition_col@2 as #5]
          UnionExec
            ProjectionExec: expr=[id@0 as id, name@1 as name, partition_col@2 as partition_col]
              SortExec: expr=[partition_col@2 ASC, id@0 ASC], preserve_partitioning=[false]
                DataSourceExec: file_groups={1 group: [[<tmp>/iceberg_explain_sort/data/partition_col=1/part-<uuid>-00000000000000000000.parquet]]}, projection=[id, name, partition_col], file_type=parquet, sort_order_for_reorder=[partition_col@2 ASC, id@0 ASC]
            ProjectionExec: expr=[id@0 as id, name@1 as name, partition_col@2 as partition_col]
              SortExec: expr=[partition_col@2 ASC, id@0 ASC], preserve_partitioning=[false]
                DataSourceExec: file_groups={1 group: [[<tmp>/iceberg_explain_sort/data/partition_col=2/part-<uuid>-00000000000000000000.parquet]]}, projection=[id, name, partition_col], file_type=parquet, sort_order_for_reorder=[partition_col@2 ASC, id@0 ASC]
---
name: "test_explain_for_unpartitioned_table_scan"
data:
  |-
    == Physical Plan ==
    ProjectionExec: expr=[#2@0 as id, #3@1 as name]
      DataSourceExec: file_groups={1 group: [[<tmp>/iceberg_explain_prune/data/part-<uuid>-00000000000000000000.parquet]]}, projection=[id@0 as #2, name@1 as #3], file_type=parquet
---
name: "test_explain_shows_column_projection"
data:
  |-
    == Physical Plan ==
    ProjectionExec: expr=[#4@0 as name, #5@1 as age]
      DataSourceExec: file_groups={1 group: [[<tmp>/iceberg_explain_projection/data/part-<uuid>-00000000000000000000.parquet]]}, projection=[name@1 as #4, age@2 as #5], file_type=parquet
---
name: "test_explain_shows_partition_pruning_for_day_transform_on_timestamp"
data:
  |-
    == Physical Plan ==
    ProjectionExec: expr=[#3@0 as id, #4@1 as payload_timestamp, #5@2 as payload]
      DataSourceExec: file_groups={1 group: [[<tmp>/iceberg_explain_prune/data/payload_timestamp_day=2024-01-02/part-<uuid>-00000000000000000000.parquet]]}, projection=[id@0 as #3, payload_timestamp@1 as #4, payload@2 as #5], file_type=parquet
---
name: "test_explain_shows_partition_pruning_for_identity_partitioning"
data:
  |-
    == Physical Plan ==
    ProjectionExec: expr=[#3@0 as id, #4@1 as value, #5@2 as category]
      ProjectionExec: expr=[id@0 as #3, value@1 as #4, category@2 as #5]
        ProjectionExec: expr=[id@0 as id, value@1 as value, category@2 as category]
          DataSourceExec: file_groups={1 group: [[<tmp>/iceberg_explain_prune/data/category=1/part-<uuid>-00000000000000000000.parquet]]}, projection=[id, value, category], file_type=parquet
---
name: "test_explain_shows_providerplanned_procedure_boundary"
data:
  |-
    == Parsed Logical Plan ==
    LakeProcedure: iceberg.ancestors_of
      IcebergProcedure: procedure=ancestors_of, invocation_id=<invocation_id>

    == Analyzed Logical Plan ==
    snapshot_id: Int64, timestamp: Int64
    LakeProcedure: iceberg.ancestors_of
      IcebergProcedure: procedure=ancestors_of, invocation_id=<invocation_id>

    == Optimized Logical Plan ==
    LakeProcedure: iceberg.ancestors_of
      IcebergProcedure: procedure=ancestors_of, invocation_id=<invocation_id>

    == Physical Plan ==
    LakeProcedureExec: lake_source=iceberg, procedure=ancestors_of, invocation_id=<invocation_id>
      CooperativeExec
        IcebergProcedureExec: procedure=ancestors_of, invocation_id=<invocation_id>
---
name: "test_metadata_files_use_a_projected_manifest_scan"
data:
  |-
    == Physical Plan ==
    ProjectionExec: expr=[#21@0 as file_path, #22@1 as record_count]
      ProjectionExec: expr=[file_path@0 as #21, record_count@1 as #22]
        CooperativeExec
          IcebergMetadataRelationExec: relation=files, partitions=2, projection=[1, 4]
---
name: "test_rewrite_uses_planned_file_groups"
data:
  |-
    == Physical Plan ==
    LakeProcedureExec: lake_source=iceberg, procedure=rewrite_data_files, invocation_id=<invocation_id>
      IcebergProcedureExec: procedure=rewrite_data_files, invocation_id=<invocation_id>
        IcebergWriterExec(table_path=file://<tmp>/iceberg_explain_procedure/)
          IcebergScanByDataFilesExec: table_url=file://<table_url>
            CooperativeExec
              IcebergFileTasksExec: groups=1, files=2

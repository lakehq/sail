# serializer version: 1
---
name: "test_explain_for_partitioned_table_with_metadataasdata_enabled"
data:
  |-
    == Physical Plan ==
    ProjectionExec: expr=[__sail_attribute_3@0 as id, __sail_attribute_4@1 as value, __sail_attribute_5@2 as category]
      ProjectionExec: expr=[id@0 as __sail_attribute_3, value@1 as __sail_attribute_4, category@2 as __sail_attribute_5]
        UnionExec
          ProjectionExec: expr=[id@0 as id, value@1 as value, category@2 as category]
            DataSourceExec: file_groups={1 group: [[<tmp>/iceberg_read_metadata_partitioned/data/category=1/part-<uuid>-00000000000000000000.parquet]]}, projection=[id, value, category], file_type=parquet
          ProjectionExec: expr=[id@0 as id, value@1 as value, category@2 as category]
            DataSourceExec: file_groups={1 group: [[<tmp>/iceberg_read_metadata_partitioned/data/category=2/part-<uuid>-00000000000000000000.parquet]]}, projection=[id, value, category], file_type=parquet
---
name: "test_explain_select_with_default_options_uses_driver_file_scan"
data:
  |-
    == Physical Plan ==
    ProjectionExec: expr=[__sail_attribute_3@0 as id, __sail_attribute_4@1 as name, __sail_attribute_5@2 as value]
      DataSourceExec: file_groups={1 group: [[<tmp>/iceberg_read_driver/data/part-<uuid>-00000000000000000000.parquet]]}, projection=[id@0 as __sail_attribute_3, name@1 as __sail_attribute_4, value@2 as __sail_attribute_5], file_type=parquet
---
name: "test_explain_select_with_metadataasdataread_true_uses_manifest_scan"
data:
  |-
    == Physical Plan ==
    ProjectionExec: expr=[__sail_attribute_3@0 as id, __sail_attribute_4@1 as name, __sail_attribute_5@2 as value]
      ProjectionExec: expr=[id@0 as __sail_attribute_3, name@1 as __sail_attribute_4, value@2 as __sail_attribute_5]
        IcebergScanByDataFilesExec: table_url=file://<table_url>
          IcebergDiscoveryExec: table_url=file://<table_url>, snapshot_id=<snapshot_id>, partition_scan=false
            RepartitionExec: partitioning=RoundRobinBatch(4), input_partitions=1
              IcebergManifestScanExec: table_url=file://<table_url>, snapshot_id=<snapshot_id>

                AggregateExec: mode=Partial, gby=[#0@0 % 2 as metadata_agg.#0 % CASE WHEN Int32(2) = Int32(0) THEN raise_error(Utf8("Remainder by zero")) ELSE Int32(2) END], aggr=[count(Int64(1)), sum(metadata_agg.#1)]

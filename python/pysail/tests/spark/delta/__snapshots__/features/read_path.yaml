    ProjectionExec: expr=[#3@0 as id, #4@1 as year, #5@2 as value]
      DataSourceExec: file_groups={1 group: [[<tmp>/delta_read_driver_partitioned/year=2024/part-<id>.snappy.parquet]]}, projection=[id@0 as #3, year@2 as #4, value@1 as #5], file_type=parquet
---

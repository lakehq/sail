    == Physical Plan ==
    ProjectionExec: expr=[#1@0 as cnt]
      ProjectionExec: expr=[3 as #1]
        PlaceholderRowExec
---
name: "test_explain_exact_aggregates_contains_no_delta_data_scan"
data:
  |-
    == Physical Plan ==
    ProjectionExec: expr=[#6@0 as count(1), #7@1 as count(nullable_value), #8@2 as MIN(id), #9@3 as MAX(score)]
      ProjectionExec: expr=[3 as #6, 2 as #7, 1 as #8, 9 as #9]
        PlaceholderRowExec
---
name: "test_explain_grouped_count_shows_metadata_rows_and_a_residual_scan"
data:
  |-
    == Physical Plan ==
    ProjectionExec: expr=[#3@0 as cnt, #4@1 as provider]
      ProjectionExec: expr=[__sail_delta_count_sum@1 as #3, #1@0 as #4]
        AggregateExec: mode=FinalPartitioned, gby=[#1@0 as #1], aggr=[sum(__sail_delta_count_weight) as __sail_delta_count_sum]
          RepartitionExec: partitioning=Hash([#1@0], 4), input_partitions=2
            AggregateExec: mode=Partial, gby=[#1@0 as #1], aggr=[sum(__sail_delta_count_weight) as __sail_delta_count_sum]
              UnionExec
                ProjectionExec: expr=[column1@0 as #1, column2@1 as __sail_delta_count_weight]
                  DataSourceExec: partitions=1, partition_sizes=[1]
                DataSourceExec: file_groups={1 group: [[<tmp>/delta_grouped_metadata/file_id=4/part-<id>.snappy.parquet]]}, projection=[provider@1 as #1, 1 as __sail_delta_count_weight], file_type=parquet
---

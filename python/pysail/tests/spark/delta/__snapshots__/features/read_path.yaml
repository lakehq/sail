# serializer version: 1
---
name: "test_distinct_literal_counts_use_snapshot_cardinality"
data:
  |-
    == Physical Plan ==
    ProjectionExec: expr=[#6@0 as one_count]
      ProjectionExec: expr=[CASE WHEN 3 > 0 THEN 1 ELSE 0 END as #6]
        PlaceholderRowExec
---
name: "test_exact_and_residual_aggregates_share_one_global_aggregate_row"
data:
  |-
    == Physical Plan ==
    ProjectionExec: expr=[#6@0 as rows, #7@1 as minimum, #8@2 as total]
      ProjectionExec: expr=[3 as #6, 1 as #7, __sail_delta_residual_aggregate_2@0 as #8]
        AggregateExec: mode=Final, gby=[], aggr=[sum(delta_exact_aggregates.#1) as __sail_delta_residual_aggregate_2]
          CoalescePartitionsExec
            AggregateExec: mode=Partial, gby=[], aggr=[sum(delta_exact_aggregates.#1) as __sail_delta_residual_aggregate_2]
              DataSourceExec: file_groups={2 groups: [[<tmp>/delta_exact_aggregates/part=10/part-<id>.snappy.parquet], [<tmp>/delta_exact_aggregates/part=2/part-<id>.snappy.parquet]]}, projection=[nullable_value@1 as #1], file_type=parquet
---
name: "test_explain_count1_on_csv_retains_the_file_scan"
data:
  |-
    == Physical Plan ==
    ProjectionExec: expr=[#1@0 as cnt]
      ProjectionExec: expr=[count(Int64(1))@0 as #1]
        AggregateExec: mode=Final, gby=[], aggr=[count(Int64(1))]
          CoalescePartitionsExec
            AggregateExec: mode=Partial, gby=[], aggr=[count(Int64(1))]
              RepartitionExec: partitioning=RoundRobinBatch(4), input_partitions=1
                DataSourceExec: file_groups={1 group: [[<tmp>/csv_count_scan/<id>_0.csv]]}, file_type=csv, has_header=false
---
name: "test_explain_count1_on_delta_replaces_the_data_scan_with_metadata"

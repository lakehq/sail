# serializer version: 1
---
name: "test_query_execution_with_storage_shuffle"
data:
  |-
    Distributed Plan
    execution_mode=local-cluster
    executed=false

    === stage 0 ===
    inputs=[]
    placement=worker
    partitions=4
    output_mode=pipelined
    distribution=hash(#1@0)
    ProjectionExec: expr=[#0@0 as #1, #0@0 * 2 as #2]
      RangeExec

    === stage 1 ===
    inputs=[StageInput(stage=0, mode=Shuffle)]
    placement=worker
    partitions=8
    output_mode=blocking
    distribution=round_robin_batch
    StageInputExec: input=0, partitioning=Hash([#1@0], 8)

    === stage 2 ===
    inputs=[]
    placement=worker
    partitions=4
    output_mode=pipelined
    distribution=hash(#4@0)
    ProjectionExec: expr=[#3@0 as #4, #3@0 + 1 as #5]
      RangeExec

    === stage 3 ===
    inputs=[StageInput(stage=2, mode=Shuffle)]
    placement=worker
    partitions=8
    output_mode=blocking
    distribution=round_robin_batch
    StageInputExec: input=0, partitioning=Hash([#4@0], 8)

    === stage 4 ===
    inputs=[StageInput(stage=1, mode=Forward), StageInput(stage=3, mode=Forward)]
    placement=worker
    partitions=8
    output_mode=pipelined
    distribution=hash(#12@0)
    AggregateExec: mode=Partial, gby=[#12@2 as #12], aggr=[count(Int64(1)), sum(#10), sum(#11)]
      ProjectionExec: expr=[#2@0 as #10, #5@1 as #11, #1@2 % 4 as #12]
        HashJoinExec: mode=Partitioned, join_type=Inner, on=[(#1@0, #4@0)], projection=[#2@1, #5@3, #1@0]
          StageInputExec: input=0, partitioning=Hash([#1@0], 8)
          StageInputExec: input=1, partitioning=Hash([#4@0], 8)

    === stage 5 ===
    inputs=[StageInput(stage=4, mode=Shuffle)]
    placement=worker
    partitions=4
    output_mode=blocking
    distribution=round_robin_batch
    StageInputExec: input=0, partitioning=Hash([#12@0], 4)

    === stage 6 ===
    inputs=[StageInput(stage=5, mode=Forward)]
    placement=worker
    partitions=4
    output_mode=pipelined
    distribution=round_robin_batch
    SortExec: expr=[#13@0 ASC], preserve_partitioning=[true]
      ProjectionExec: expr=[#12@0 as #13, count(Int64(1))@1 as #14, sum(#10)@2 as #15, sum(#11)@3 as #16]
        AggregateExec: mode=FinalPartitioned, gby=[#12@0 as #12], aggr=[count(Int64(1)), sum(#10), sum(#11)]
          StageInputExec: input=0, partitioning=Hash([#12@0], 4)

    === stage 7 ===
    inputs=[StageInput(stage=6, mode=Merge)]
    placement=worker
    partitions=1
    output_mode=pipelined
    distribution=round_robin_batch
    ProjectionExec: expr=[#13@0 as g, #14@1 as count, #15@2 as s1, #16@3 as s2]
      SortPreservingMergeExec: [#13@0 ASC]
        StageInputExec: input=0, partitioning=Hash([#13@0], 4)

    === exchanges ===
    stage 0 -> stage 1: kind=shuffle, distribution=hash(#1@0), channels=8
    stage 2 -> stage 3: kind=shuffle, distribution=hash(#4@0), channels=8
    stage 1 -> stage 4: kind=forward, distribution=round_robin_batch, channels=1
    stage 3 -> stage 4: kind=forward, distribution=round_robin_batch, channels=1
    stage 4 -> stage 5: kind=shuffle, distribution=hash(#12@0), channels=4
    stage 5 -> stage 6: kind=forward, distribution=round_robin_batch, channels=1
    stage 6 -> stage 7: kind=merge, distribution=round_robin_batch, channels=1

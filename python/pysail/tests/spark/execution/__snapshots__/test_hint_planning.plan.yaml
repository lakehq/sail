    ProjectionExec: expr=[#2@0 as a, #3@1 as b]
      ProjectionExec: expr=[#0@0 as #2, #1@1 as #3]
        NestedLoopJoinExec: join_type=Inner, filter=#1@0 = l.#0 % Int64(3)@2, projection=[#0@0, #1@2]
          StageInputExec: input=0, partitioning=UnknownPartitioning(1)
          ProjectionExec: expr=[id@0 as #1]
            CooperativeExec
              RangeExec: start=0, end=3, step=1, num_partitions=2, projection=[0]
---
name: "test_partition_hint_distributed_plan_and_results[REBALANCE(3, id)]"
data:
  |-
    === stage 0 ===
    inputs=[]
    mode=Pipelined
    partitions=4
    distribution=Hash(keys=[#1@0], channels=3)
    placement=Worker
    ProjectionExec: expr=[id@0 as #1]
      RangeExec: start=0, end=12, step=1, num_partitions=4, projection=[0]

    === stage 1 ===
    inputs=[StageInput(stage=0, mode=Shuffle)]
    mode=Pipelined
    partitions=3
    distribution=RoundRobinBatch(channels=1)
    placement=Worker
    ProjectionExec: expr=[#1@0 as id]
      StageInputExec: input=0, partitioning=Hash([#1@0], 3)
---
name: "test_partition_hint_distributed_plan_and_results[REPARTITION_BY_RANGE(3, id)]"
data:
  |-
    === stage 0 ===
    inputs=[]
    mode=Pipelined
    partitions=4
    distribution=RoundRobinBatch(channels=1)
    placement=Worker
    ProjectionExec: expr=[id@0 as #1]
      SortExec: expr=[id@0 ASC], preserve_partitioning=[true]
        RangeExec: start=0, end=12, step=1, num_partitions=4, projection=[0]

    === stage 1 ===
    inputs=[StageInput(stage=0, mode=Merge)]
    mode=Pipelined
    partitions=1
    distribution=Range([#2@1 ASC], [(0.3333333333333333), (0.6666666666666666)], 3)
    placement=Worker
    WindowAggExec: wdw=[#2: Ok(Field { name: "#2", data_type: Float64 }), frame: WindowFrame { units: Rows, start_bound: Preceding(UInt64(NULL)), end_bound: CurrentRow, is_causal: true }]
      SortPreservingMergeExec: [#1@0 ASC]
        StageInputExec: input=0, partitioning=RoundRobinBatch(4)

    === stage 2 ===
    inputs=[StageInput(stage=1, mode=Shuffle)]
    mode=Pipelined
    partitions=3
    distribution=RoundRobinBatch(channels=1)
    placement=Worker
    ProjectionExec: expr=[#1@0 as id]
      ProjectionExec: expr=[#1@0 as #1]
        StageInputExec: input=0, partitioning=Range([#2@1 ASC], [(0.3333333333333333), (0.6666666666666666)], 3)

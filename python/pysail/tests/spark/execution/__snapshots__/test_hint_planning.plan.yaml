# serializer version: 1
---
name: "test_join_hint_distributed_plan_and_results[BROADCAST]"
data:
  |-
    === stage 0 ===
    inputs=[]
    mode=Pipelined
    partitions=3
    distribution=RoundRobinBatch(channels=1)
    placement=Worker
    ProjectionExec: expr=[id@0 as #0, id@0 % 3 as l.#0 % Int64(3)]
      RangeExec: start=0, end=6, step=1, num_partitions=3, projection=[0]

    === stage 1 ===
    inputs=[StageInput(stage=0, mode=Broadcast)]
    mode=Pipelined
    partitions=2
    distribution=RoundRobinBatch(channels=1)
    placement=Worker
    ProjectionExec: expr=[#2@0 as a, #3@1 as b]
      ProjectionExec: expr=[#0@0 as #2, #1@1 as #3]
        HashJoinExec: mode=CollectLeft, join_type=Inner, on=[(l.#0 % Int64(3)@1, #1@0)], projection=[#0@0, #1@2]
          StageInputExec: input=0, partitioning=UnknownPartitioning(1)
          ProjectionExec: expr=[id@0 as #1]
            CooperativeExec
              RangeExec: start=0, end=3, step=1, num_partitions=2, projection=[0]
---
name: "test_join_hint_distributed_plan_and_results[MERGE]"
data:
  |-
    === stage 0 ===
    inputs=[]
    mode=Pipelined
    partitions=2
    distribution=Hash(keys=[#1@0], channels=4)
    placement=Worker
    ProjectionExec: expr=[id@0 as #1]
      RangeExec: start=0, end=3, step=1, num_partitions=2, projection=[0]

    === stage 1 ===
    inputs=[]
    mode=Pipelined
    partitions=3
    distribution=Hash(keys=[l.#0 % Int64(3)@1], channels=4)
    placement=Worker
    ProjectionExec: expr=[id@0 as #0, id@0 % 3 as l.#0 % Int64(3)]
      RangeExec: start=0, end=6, step=1, num_partitions=3, projection=[0]

    === stage 2 ===
    inputs=[StageInput(stage=0, mode=Shuffle), StageInput(stage=1, mode=Shuffle)]
    mode=Pipelined
    partitions=4
    distribution=RoundRobinBatch(channels=1)
    placement=Worker
    ProjectionExec: expr=[#2@0 as a, #3@1 as b]
      ProjectionExec: expr=[#0@1 as #2, #1@0 as #3]
        SortMergeJoinExec: join_type=Inner, on=[(#1@0, l.#0 % Int64(3)@1)]
          SortExec: expr=[#1@0 ASC], preserve_partitioning=[true]
            StageInputExec: input=0, partitioning=Hash([#1@0], 4)
          SortExec: expr=[l.#0 % Int64(3)@1 ASC], preserve_partitioning=[true]
            StageInputExec: input=1, partitioning=Hash([l.#0 % Int64(3)@1], 4)
---
name: "test_join_hint_distributed_plan_and_results[SHUFFLE_HASH]"
data:

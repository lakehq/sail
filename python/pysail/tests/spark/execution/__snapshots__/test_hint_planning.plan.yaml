        HashJoinExec: mode=Partitioned, join_type=Inner, on=[(l.#0 % Int64(3)@1, #1@0)], projection=[#0@0, #1@2]
          StageInputExec: input=0, partitioning=Hash([l.#0 % Int64(3)@1], 4)
          StageInputExec: input=1, partitioning=Hash([#1@0], 4)
---
name: "test_join_hint_distributed_plan_and_results[SHUFFLE_REPLICATE_NL]"
data:
  |-
    === stage 0 ===
    inputs=[]
    mode=MaterializedLocal
    partitions=2
    distribution=RoundRobinBatch(channels=1)
    placement=Worker
    ProjectionExec: expr=[id@0 as #1]
      CooperativeExec
        RangeExec: start=0, end=3, step=1, num_partitions=2, projection=[0]

    === stage 1 ===
    inputs=[]
    mode=MaterializedLocal
    partitions=3
    distribution=RoundRobinBatch(channels=1)
    placement=Worker
    ProjectionExec: expr=[id@0 as #0, id@0 % 3 as l.#0 % Int64(3)]
      CooperativeExec
        RangeExec: start=0, end=6, step=1, num_partitions=3, projection=[0]

    === stage 2 ===
    inputs=[StageInput(stage=0, mode=Replay), StageInput(stage=1, mode=Replay)]
    mode=Pipelined
    partitions=6
    distribution=RoundRobinBatch(channels=1)
    placement=Worker
    ProjectionExec: expr=[#2@0 as a, #3@1 as b]
      ProjectionExec: expr=[#0@1 as #2, #1@0 as #3]
        PartitionPairJoinExec: partitions=2x3, filter=#1@0 = l.#0 % Int64(3)@2
          StageInputExec: input=0, partitioning=RoundRobinBatch(2)
          StageInputExec: input=1, partitioning=RoundRobinBatch(3)
---
name: "test_partition_hint_distributed_plan_and_results[REBALANCE(3, id)]"
data:
  |-
    === stage 0 ===
    inputs=[]
    mode=Pipelined
    partitions=4
    distribution=Hash(keys=[#1@0], channels=3)
    placement=Worker
    ProjectionExec: expr=[id@0 as #1]
      RangeExec: start=0, end=12, step=1, num_partitions=4, projection=[0]

    === stage 1 ===
    inputs=[StageInput(stage=0, mode=Shuffle)]
    mode=Pipelined
    partitions=3
    distribution=RoundRobinBatch(channels=1)
    placement=Worker
    ProjectionExec: expr=[#1@0 as id]
      StageInputExec: input=0, partitioning=Hash([#1@0], 3)
---
name: "test_partition_hint_distributed_plan_and_results[REPARTITION_BY_RANGE(3, id)]"
data:
  |-
    === stage 0 ===
    inputs=[]
    mode=MaterializedLocal
    partitions=4
    distribution=RoundRobinBatch(channels=1)
    placement=Worker
    ProjectionExec: expr=[#1@0 as #1, #1@0 as __sail_range_key_0]
      ProjectionExec: expr=[id@0 as #1]
        CooperativeExec
          RangeExec: start=0, end=12, step=1, num_partitions=4, projection=[0]

    === stage 1 ===
    inputs=[StageInput(stage=0, mode=Replay)]
    mode=MaterializedLocal
    partitions=4
    distribution=RoundRobinBatch(channels=1)
    placement=Worker
    RangeSampleExec: keys=[(1, SortOptions { descending: false, nulls_first: true })], capacity=1024
      StageInputExec: input=0, partitioning=RoundRobinBatch(4)

    === stage 2 ===
    inputs=[StageInput(stage=1, mode=Replay)]
    mode=MaterializedLocal
    partitions=1
    distribution=RoundRobinBatch(channels=1)
    placement=Worker
    RangeBoundsExec: partitions=3, capacity=65536
      StageInputExec: input=0, partitioning=UnknownPartitioning(4)

    === stage 3 ===
    inputs=[StageInput(stage=0, mode=Replay), StageInput(stage=2, mode=Replay)]
    mode=MaterializedLocal
    partitions=4
    distribution=Range([__sail_range_destination@2 ASC], [(1), (2)], 3)
    placement=Worker
    RangeAssignExec: keys=[(1, SortOptions { descending: false, nulls_first: true })]
      StageInputExec: input=0, partitioning=RoundRobinBatch(4)
      StageInputExec: input=1, partitioning=UnknownPartitioning(1)

    === stage 4 ===
    inputs=[StageInput(stage=3, mode=Shuffle)]
    mode=Pipelined
    partitions=3
    distribution=RoundRobinBatch(channels=1)
    placement=Worker
    ProjectionExec: expr=[#1@0 as id]
      ProjectionExec: expr=[#1@0 as #1]
        StageInputExec: input=0, partitioning=UnknownPartitioning(3)

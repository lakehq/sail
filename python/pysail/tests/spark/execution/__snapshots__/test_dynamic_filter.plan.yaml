# serializer version: 1
---
name: "test_join_filters_cross_exchanges[flight-1]"
data:
  |-
    === stage 0 ===
    inputs=[]
    mode=Pipelined
    partitions=1
    distribution=RoundRobinBatch(channels=4)
    placement=Worker
    RangeExec

    === stage 1 ===
    inputs=[StageInput(stage=0, mode=Shuffle)]
    mode=Pipelined
    partitions=4
    distribution=Hash(keys=[#1@0], channels=4)
    placement=Worker
    DynamicFilterBuildExec: keys=[#1@0]
      ProjectionExec: expr=[CASE WHEN #0@0 = 0 THEN 1 WHEN #0@0 = 3 THEN 93 ELSE 17 END as #1]
        StageInputExec: input=0, partitioning=RoundRobinBatch(4)

    === stage 2 ===
    inputs=[]
    mode=Pipelined
    partitions=1
    distribution=Hash(keys=[#7@1], channels=4)
    placement=Worker
    DataSourceExec: file_groups={1 group: [[<tmp>/data/<id>_0.zst.parquet]]}, projection=[label@2 as #5, k@0 as #7], file_type=parquet, predicate=DynamicFilter [ empty ], dynamic_rg_pruning=eligible

    === stage 3 ===
    inputs=[StageInput(stage=1, mode=Shuffle), StageInput(stage=2, mode=Shuffle)]
    mode=Pipelined
    partitions=4
    distribution=RoundRobinBatch(channels=1)
    placement=Worker
    SortExec: expr=[#11@0 ASC], preserve_partitioning=[true]
      ProjectionExec: expr=[#1@0 as #11, #5@1 as #12]
        HashJoinExec: mode=Partitioned, join_type=Inner, on=[(#1@0, #7@1)], projection=[#1@0, #5@1]
          StageInputExec: input=0, partitioning=Hash([#1@0], 4)
          StageInputExec: input=1, partitioning=Hash([#7@1], 4)

    === stage 4 ===
    inputs=[StageInput(stage=3, mode=Merge)]
    mode=Pipelined
    partitions=1
    distribution=RoundRobinBatch(channels=1)
    placement=Worker
    ProjectionExec: expr=[#11@0 as k, #12@1 as label]
      SortPreservingMergeExec: [#11@0 ASC]
        StageInputExec: input=0, partitioning=Hash([#11@0], 4)

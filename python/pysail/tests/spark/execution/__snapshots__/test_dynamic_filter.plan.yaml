name: "test_nested_filters[flight]"
data:
  |-
    === stage 0 ===
    inputs=[]
    mode=Pipelined
    partitions=2
    distribution=RoundRobinBatch(channels=4)
    placement=Worker
    RangeExec

    === stage 1 ===
    inputs=[StageInput(stage=0, mode=Shuffle)]
    mode=Pipelined
    partitions=4
    distribution=Hash(keys=[#1@0], channels=4)
    placement=Worker
    ProjectionExec: expr=[#0@0 * 34 as #1]
      StageInputExec: input=0, partitioning=RoundRobinBatch(4)

    === stage 2 ===
    inputs=[]
    mode=Pipelined
    partitions=4
    distribution=Hash(keys=[#3@0], channels=4)
    placement=Worker
    DynamicFilterBuildExec: keys=[#3@0]
      ProjectionExec: expr=[#2@0 * 17 as #3]
        RangeExec

    === stage 3 ===
    inputs=[]
    mode=Pipelined
    partitions=1
    distribution=RoundRobinBatch(channels=4)
    placement=Worker
    DataSourceExec: file_groups={1 group: [[<tmp>/data/<id>_0.zst.parquet]]}, projection=[k], file_type=parquet, predicate=k@0 < 100 AND DynamicFilter [ empty ], dynamic_rg_pruning=eligible, pruning_predicate=k_null_count@1 != row_count@2 AND k_min@0 < 100, required_guarantees=[]

    === stage 4 ===
    inputs=[StageInput(stage=3, mode=Shuffle)]
    mode=Pipelined
    partitions=4
    distribution=Hash(keys=[#4@0], channels=4)
    placement=Worker
    ProjectionExec: expr=[k@0 as #4]
      FilterExec: k@0 < 100
        StageInputExec: input=0, partitioning=RoundRobinBatch(4)

    === stage 5 ===
    inputs=[StageInput(stage=1, mode=Shuffle), StageInput(stage=2, mode=Shuffle), StageInput(stage=4, mode=Shuffle)]
    mode=Pipelined
    partitions=4
    distribution=RoundRobinBatch(channels=1)
    placement=Worker
    ProjectionExec: expr=[#13@0 as k]
      ProjectionExec: expr=[#1@0 as #13]
        HashJoinExec: mode=Partitioned, join_type=Inner, on=[(#1@0, #9@0)], projection=[#1@0]
          StageInputExec: input=0, partitioning=Hash([#1@0], 4)
          ProjectionExec: expr=[#3@0 as #9]
            HashJoinExec: mode=Partitioned, join_type=Inner, on=[(#3@0, #4@0)], projection=[#3@0]
              StageInputExec: input=1, partitioning=Hash([#3@0], 4)
              StageInputExec: input=2, partitioning=Hash([#4@0], 4)

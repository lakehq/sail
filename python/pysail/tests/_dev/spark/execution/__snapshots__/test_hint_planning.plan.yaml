# serializer version: 1
---
name: "test_join_hint_distributed_plan_and_results[BROADCAST]"
data:
  |-
    === stage 0 ===
    inputs=[]
    mode=Pipelined
    partitions=3
    distribution=RoundRobinBatch(channels=1)
    placement=Worker
    ProjectionExec: expr=[id@0 as #0, id@0 % 3 as l.#0 % Int64(3)]
      RangeExec: start=0, end=6, step=1, num_partitions=3, projection=[0]

    === stage 1 ===
    inputs=[StageInput(stage=0, mode=Broadcast)]
    mode=Pipelined
    partitions=2
    distribution=RoundRobinBatch(channels=1)
    placement=Worker
    ProjectionExec: expr=[#2@0 as a, #3@1 as b]
      ProjectionExec: expr=[#0@0 as #2, #1@1 as #3]
        HashJoinExec: mode=CollectLeft, join_type=Inner, on=[(l.#0 % Int64(3)@1, #1@0)], projection=[#0@0, #1@2]
          StageInputExec: input=0, partitioning=UnknownPartitioning(1)
          ProjectionExec: expr=[id@0 as #1]
            CooperativeExec
              RangeExec: start=0, end=3, step=1, num_partitions=2, projection=[0]
---
name: "test_join_hint_distributed_plan_and_results[MERGE]"
data:
  |-
    === stage 0 ===
    inputs=[]
    mode=Pipelined
    partitions=2
    distribution=Hash(keys=[#1@0], channels=4)
    placement=Worker
    ProjectionExec: expr=[id@0 as #1]
      RangeExec: start=0, end=3, step=1, num_partitions=2, projection=[0]

    === stage 1 ===
    inputs=[]
    mode=Pipelined
    partitions=3
    distribution=Hash(keys=[l.#0 % Int64(3)@1], channels=4)
    placement=Worker
    ProjectionExec: expr=[id@0 as #0, id@0 % 3 as l.#0 % Int64(3)]
      RangeExec: start=0, end=6, step=1, num_partitions=3, projection=[0]

    === stage 2 ===
    inputs=[StageInput(stage=0, mode=Shuffle), StageInput(stage=1, mode=Shuffle)]
    mode=Pipelined
    partitions=4
    distribution=RoundRobinBatch(channels=1)
    placement=Worker
    ProjectionExec: expr=[#2@0 as a, #3@1 as b]
      ProjectionExec: expr=[#0@0 as #2, #1@1 as #3]
        SortMergeJoinExec: join_type=Inner, on=[(#1@0, l.#0 % Int64(3)@1)], projection=[#0@1, #1@0]
          SortExec: expr=[#1@0 ASC], preserve_partitioning=[true]
            StageInputExec: input=0, partitioning=Hash([#1@0], 4)
          SortExec: expr=[l.#0 % Int64(3)@1 ASC], preserve_partitioning=[true]
            StageInputExec: input=1, partitioning=Hash([l.#0 % Int64(3)@1], 4)
---
name: "test_join_hint_distributed_plan_and_results[SHUFFLE_HASH]"
data:
  |-
    === stage 0 ===
    inputs=[]
    mode=Pipelined
    partitions=3
    distribution=Hash(keys=[l.#0 % Int64(3)@1], channels=4)
    placement=Worker
    ProjectionExec: expr=[id@0 as #0, id@0 % 3 as l.#0 % Int64(3)]
      RangeExec: start=0, end=6, step=1, num_partitions=3, projection=[0]

    === stage 1 ===
    inputs=[]
    mode=Pipelined
    partitions=2
    distribution=Hash(keys=[#1@0], channels=4)
    placement=Worker
    ProjectionExec: expr=[id@0 as #1]
      RangeExec: start=0, end=3, step=1, num_partitions=2, projection=[0]

    === stage 2 ===
    inputs=[StageInput(stage=0, mode=Shuffle), StageInput(stage=1, mode=Shuffle)]
    mode=Pipelined
    partitions=4
    distribution=RoundRobinBatch(channels=1)
    placement=Worker
    ProjectionExec: expr=[#2@0 as a, #3@1 as b]
      ProjectionExec: expr=[#0@0 as #2, #1@1 as #3]
        HashJoinExec: mode=Partitioned, join_type=Inner, on=[(l.#0 % Int64(3)@1, #1@0)], projection=[#0@0, #1@2]
          StageInputExec: input=0, partitioning=Hash([l.#0 % Int64(3)@1], 4)
          StageInputExec: input=1, partitioning=Hash([#1@0], 4)
---
name: "test_join_hint_distributed_plan_and_results[SHUFFLE_REPLICATE_NL]"
data:
  |-
    === stage 0 ===
    inputs=[]
    mode=MaterializedLocal
    partitions=2
    distribution=RoundRobinBatch(channels=1)
    placement=Worker
    ProjectionExec: expr=[id@0 as #1]
      CooperativeExec
        RangeExec: start=0, end=3, step=1, num_partitions=2, projection=[0]

    === stage 1 ===
    inputs=[]
    mode=MaterializedLocal
    partitions=3
    distribution=RoundRobinBatch(channels=1)
    placement=Worker
    ProjectionExec: expr=[id@0 as #0, id@0 % 3 as l.#0 % Int64(3)]
      CooperativeExec
        RangeExec: start=0, end=6, step=1, num_partitions=3, projection=[0]

    === stage 2 ===
    inputs=[StageInput(stage=0, mode=Replay), StageInput(stage=1, mode=Replay)]
    mode=Pipelined
    partitions=6
    distribution=RoundRobinBatch(channels=1)
    placement=Worker
    ProjectionExec: expr=[#2@0 as a, #3@1 as b]
      ProjectionExec: expr=[#0@1 as #2, #1@0 as #3]
        PartitionPairJoinExec: partitions=2x3, filter=#1@0 = l.#0 % Int64(3)@2
          StageInputExec: input=0, partitioning=RoundRobinBatch(2)
          StageInputExec: input=1, partitioning=RoundRobinBatch(3)
---
name: "test_partition_hint_distributed_plan_and_results[REBALANCE(3, id)]"
data:
  |-
    === stage 0 ===
    inputs=[]
    mode=Pipelined
    partitions=4
    distribution=Hash(keys=[#1@0], channels=3)
    placement=Worker
    ProjectionExec: expr=[id@0 as #1]
      RangeExec: start=0, end=12, step=1, num_partitions=4, projection=[0]

    === stage 1 ===
    inputs=[StageInput(stage=0, mode=Shuffle)]
    mode=Pipelined
    partitions=3
    distribution=RoundRobinBatch(channels=1)
    placement=Worker
    ProjectionExec: expr=[#1@0 as id]
      StageInputExec: input=0, partitioning=Hash([#1@0], 3)
---
name: "test_partition_hint_distributed_plan_and_results[REPARTITION_BY_RANGE(3, id)]"
data:
  |-
    === stage 0 ===
    inputs=[]
    mode=Pipelined
    partitions=4
    distribution=RoundRobinBatch(channels=1)
    placement=Worker
    RangePartitionSampleExec: sample_size=225
      ProjectionExec: expr=[id@0 as key_0]
        CooperativeExec
          RangeExec: start=0, end=12, step=1, num_partitions=4, projection=[0]

    === stage 1 ===
    inputs=[StageInput(stage=0, mode=Rescale(partitions=4))]
    mode=Pipelined
    partitions=4
    distribution=RoundRobinBatch(channels=1)
    placement=Worker
    StageInputExec: input=0, partitioning=UnknownPartitioning(4)

    === stage 2 ===
    inputs=[StageInput(stage=0, mode=Rescale(partitions=4))]
    mode=Pipelined
    partitions=4
    distribution=RoundRobinBatch(channels=1)
    placement=Worker
    StageInputExec: input=0, partitioning=UnknownPartitioning(4)

    === stage 3 ===
    inputs=[StageInput(stage=2, mode=Shuffle)]
    mode=Pipelined
    partitions=1
    distribution=RoundRobinBatch(channels=1)
    placement=Worker
    RangeResampleDecisionExec
      StageInputExec: input=0, partitioning=UnknownPartitioning(1)

    === stage 4 ===
    inputs=[StageInput(stage=3, mode=Broadcast)]
    mode=Pipelined
    partitions=4
    distribution=RoundRobinBatch(channels=1)
    placement=Worker
    RangeResampleExec
      ProjectionExec: expr=[id@0 as key_0]
        CooperativeExec
          RangeExec: start=0, end=12, step=1, num_partitions=4, projection=[0]
      StageInputExec: input=0, partitioning=UnknownPartitioning(1)

    === stage 5 ===
    inputs=[StageInput(stage=1, mode=Shuffle), StageInput(stage=4, mode=Shuffle)]
    mode=Pipelined
    partitions=1
    distribution=RoundRobinBatch(channels=1)
    placement=Driver
    RangeSplitPointsExec: partitions=3, sample_size=300
      StageInputExec: input=0, partitioning=UnknownPartitioning(1)
      StageInputExec: input=1, partitioning=UnknownPartitioning(1)

    === stage 6 ===
    inputs=[StageInput(stage=5, mode=Broadcast)]
    mode=Pipelined
    partitions=4
    distribution=Channel(channels=3)
    placement=Worker
    RangeChannelExec: ordering=[#1@0 ASC]
      ProjectionExec: expr=[id@0 as #1]
        CooperativeExec
          RangeExec: start=0, end=12, step=1, num_partitions=4, projection=[0]
      StageInputExec: input=0, partitioning=UnknownPartitioning(1)

    === stage 7 ===
    inputs=[StageInput(stage=6, mode=Shuffle)]
    mode=Pipelined
    partitions=3
    distribution=RoundRobinBatch(channels=1)
    placement=Worker
    ProjectionExec: expr=[#1@0 as id]
      StageInputExec: input=0, partitioning=UnknownPartitioning(3)

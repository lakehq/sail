name: "test_repeated_scalar_subqueries_over_one_catalog_table_share_one_result"
data:
  |-
    == Physical Plan ==
    ProjectionExec: expr=[#7@0 as channel, #8@1 as total]
      ScalarSubqueryExec: subqueries=1
        UnionExec
          ProjectionExec: expr=[store as #7, sum(f.#3)@0 as #8]
            AggregateExec: mode=Final, gby=[], aggr=[sum(f.#3)]
              CoalescePartitionsExec
                AggregateExec: mode=Partial, gby=[], aggr=[sum(f.#3)]
                  RepartitionExec: partitioning=RoundRobinBatch(4), input_partitions=1
                    ProjectionExec: expr=[column2@0 as #3]
                      FilterExec: column1@0 = scalar_subquery(<pending>), projection=[column2@1]
                        DataSourceExec: partitions=1, partition_sizes=[1]
          ProjectionExec: expr=[catalog as #7, sum(f.#12)@0 as #8]
            AggregateExec: mode=Final, gby=[], aggr=[sum(f.#12)]
              CoalescePartitionsExec
                AggregateExec: mode=Partial, gby=[], aggr=[sum(f.#12)]
                  RepartitionExec: partitioning=RoundRobinBatch(4), input_partitions=1
                    ProjectionExec: expr=[column2@0 as #12]
                      FilterExec: column1@0 = scalar_subquery(<pending>), projection=[column2@1]
                        DataSourceExec: partitions=1, partition_sizes=[1]
          ProjectionExec: expr=[web as #7, sum(f.#21)@0 as #8]
            AggregateExec: mode=Final, gby=[], aggr=[sum(f.#21)]
              CoalescePartitionsExec
                AggregateExec: mode=Partial, gby=[], aggr=[sum(f.#21)]
                  RepartitionExec: partitioning=RoundRobinBatch(4), input_partitions=1
                    ProjectionExec: expr=[column2@0 as #21]
                      FilterExec: column1@0 = scalar_subquery(<pending>), projection=[column2@1]
                        DataSourceExec: partitions=1, partition_sizes=[1]
        ProjectionExec: expr=[w@0 as #6]
          FilterExec: d@0 = 2000-01-08, projection=[w@1]
            RepartitionExec: partitioning=RoundRobinBatch(4), input_partitions=1
              DataSourceExec: file_groups={1 group: [[<tmp>/scalar_sharing_dates/<id>_0.zst.parquet]]}, projection=[d, w], file_type=parquet, predicate=d@0 = 2000-01-08, pruning_predicate=d_null_count@2 != row_count@3 AND d_min@0 <= 2000-01-08 AND 2000-01-08 <= d_max@1, required_guarantees=[d in (2000-01-08)]

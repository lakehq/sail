apiVersion: apps/v1
kind: Deployment
metadata:
  name: sail-spark-server
  labels:
    app.kubernetes.io/name: sail
    app.kubernetes.io/component: spark-server
    app.kubernetes.io/part-of: sail-production
spec:
  # The server holds all Spark Connect sessions in this process. Replacing it
  # ends those sessions, so this baseline does not perform a rolling update.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: sail
      app.kubernetes.io/component: spark-server
  template:
    metadata:
      labels:
        app.kubernetes.io/name: sail
        app.kubernetes.io/component: spark-server
        app.kubernetes.io/part-of: sail-production
    spec:
      serviceAccountName: sail-server
      automountServiceAccountToken: true
      enableServiceLinks: false
      terminationGracePeriodSeconds: 120
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: server
          image: sail-production:local
          imagePullPolicy: IfNotPresent
          command: ["sail"]
          args: ["spark", "server", "--ip", "0.0.0.0", "--port", "50051"]
          ports:
            - name: spark-connect
              containerPort: 50051
              protocol: TCP
          env:
            - name: RUST_LOG
              value: info
            - name: HOME
              value: /tmp/sail-home
            - name: PYTHONDONTWRITEBYTECODE
              value: "1"
            - name: PYTHONPYCACHEPREFIX
              value: /tmp/python-cache
            - name: SAIL_MODE
              value: kubernetes-cluster
            - name: SAIL_CLUSTER__DRIVER_LISTEN_HOST
              value: 0.0.0.0
            - name: SAIL_CLUSTER__DRIVER_EXTERNAL_HOST
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: SAIL_CLUSTER__ENABLE_TLS
              value: "false"
            - name: SAIL_CLUSTER__WORKER_INITIAL_COUNT
              value: "0"
            - name: SAIL_CLUSTER__WORKER_MAX_COUNT
              value: "4"
            - name: SAIL_CLUSTER__WORKER_MAX_IDLE_TIME_SECS
              value: "60"
            - name: SAIL_CLUSTER__WORKER_HEARTBEAT_INTERVAL_SECS
              value: "10"
            - name: SAIL_CLUSTER__WORKER_HEARTBEAT_TIMEOUT_SECS
              value: "120"
            - name: SAIL_CLUSTER__WORKER_LAUNCH_TIMEOUT_SECS
              value: "120"
            - name: SAIL_CLUSTER__WORKER_TASK_SLOTS
              value: "2"
            - name: SAIL_CLUSTER__TASK_LAUNCH_TIMEOUT_SECS
              value: "120"
            - name: SAIL_CLUSTER__TASK_STREAM_BUFFER
              value: "16"
            - name: SAIL_CLUSTER__TASK_STREAM_CREATION_TIMEOUT_SECS
              value: "60"
            - name: SAIL_CLUSTER__TASK_MAX_ATTEMPTS
              value: "3"
            - name: SAIL_CLUSTER__RPC_RETRY_STRATEGY__TYPE
              value: fixed
            - name: SAIL_CLUSTER__RPC_RETRY_STRATEGY__FIXED__MAX_COUNT
              value: "3"
            - name: SAIL_CLUSTER__RPC_RETRY_STRATEGY__FIXED__DELAY_SECS
              value: "5"
            - name: SAIL_CLUSTER__SHUFFLE_BACKEND__TYPE
              value: flight
            - name: SAIL_EXECUTION__DEFAULT_PARALLELISM
              value: "8"
            - name: SAIL_KUBERNETES__IMAGE
              value: sail-production:local
            - name: SAIL_KUBERNETES__IMAGE_PULL_POLICY
              value: IfNotPresent
            - name: SAIL_KUBERNETES__NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: SAIL_KUBERNETES__DRIVER_POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: SAIL_KUBERNETES__WORKER_SERVICE_ACCOUNT_NAME
              value: sail-worker
            - name: SAIL_KUBERNETES__WORKER_POD_TEMPLATE
              valueFrom:
                configMapKeyRef:
                  name: sail-worker-pod-template
                  key: pod-template.json
            - name: SAIL_RUNTIME__MEMORY_POOL__TYPE
              value: fair
            - name: SAIL_RUNTIME__MEMORY_POOL__FAIR__MAX_SIZE
              value: "1610612736"
            - name: SAIL_RUNTIME__TEMPORARY_FILES__PATHS
              value: '["/tmp/sail"]'
            - name: SAIL_RUNTIME__TEMPORARY_FILES__MAX_SIZE
              value: "4294967296"
            - name: SAIL_SPARK__SESSION_TIMEOUT_SECS
              value: "900"
            - name: SAIL_SPARK__EXECUTION_HEARTBEAT_INTERVAL_SECS
              value: "15"
          resources:
            requests:
              cpu: "1"
              memory: 2Gi
              ephemeral-storage: 5Gi
            limits:
              cpu: "2"
              memory: 2Gi
              ephemeral-storage: 5Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
          startupProbe:
            grpc:
              port: 50051
              service: spark.connect.SparkConnectService
            periodSeconds: 2
            timeoutSeconds: 1
            failureThreshold: 60
          readinessProbe:
            grpc:
              port: 50051
              service: spark.connect.SparkConnectService
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          volumeMounts:
            - name: scratch
              mountPath: /tmp
      volumes:
        - name: scratch
          emptyDir:
            sizeLimit: 5Gi

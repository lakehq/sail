apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - image-reference.yaml
  - service-accounts.yaml
  - rbac.yaml
  - worker-pod-template.yaml
  - server.yaml
  - service.yaml
  - network-policy.yaml
  - disruption-budget.yaml

replacements:
  - source:
      kind: ConfigMap
      name: sail-production-settings
      fieldPath: data.image
    targets:
      - select:
          kind: Deployment
          name: sail-spark-server
        fieldPaths:
          - spec.template.spec.containers.[name=server].image
          - spec.template.spec.containers.[name=server].env.[name=SAIL_KUBERNETES__IMAGE].value

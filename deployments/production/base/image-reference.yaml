apiVersion: v1
kind: ConfigMap
metadata:
  name: sail-production-settings
  labels:
    app.kubernetes.io/name: sail
    app.kubernetes.io/part-of: sail-production
data:
  # Replace this with one immutable image digest for the server and workers.
  image: sail-production:local
  # Record the source revision used to build the image.
  source-revision: replace-before-production-use

apiVersion: v1
kind: ConfigMap
metadata:
  name: sail-worker-pod-template
data:
  pod-template.json: |
    {
      "metadata": {
        "labels": {
          "app.kubernetes.io/part-of": "sail-production"
        }
      },
      "spec": {
        "automountServiceAccountToken": false,
        "enableServiceLinks": false,
        "securityContext": {
          "runAsNonRoot": true,
          "runAsUser": 10001,
          "runAsGroup": 10001,
          "fsGroup": 10001,
          "seccompProfile": {
            "type": "RuntimeDefault"
          }
        },
        "containers": [
          {
            "name": "worker",
            "env": [
              {
                "name": "HOME",
                "value": "/tmp/sail-home"
              },
              {
                "name": "PYTHONDONTWRITEBYTECODE",
                "value": "1"
              },
              {
                "name": "PYTHONPYCACHEPREFIX",
                "value": "/tmp/python-cache"
              },
              {
                "name": "SAIL_RUNTIME__MEMORY_POOL__TYPE",
                "value": "fair"
              },
              {
                "name": "SAIL_RUNTIME__MEMORY_POOL__FAIR__MAX_SIZE",
                "value": "1610612736"
              },
              {
                "name": "SAIL_RUNTIME__TEMPORARY_FILES__PATHS",
                "value": "[\"/tmp/sail\"]"
              },
              {
                "name": "SAIL_RUNTIME__TEMPORARY_FILES__MAX_SIZE",
                "value": "4294967296"
              }
            ],
            "resources": {
              "requests": {
                "cpu": "1",
                "memory": "2Gi",
                "ephemeral-storage": "5Gi"
              },
              "limits": {
                "cpu": "2",
                "memory": "2Gi",
                "ephemeral-storage": "5Gi"
              }
            },
            "securityContext": {
              "allowPrivilegeEscalation": false,
              "capabilities": {
                "drop": ["ALL"]
              },
              "readOnlyRootFilesystem": true
            },
            "volumeMounts": [
              {
                "name": "scratch",
                "mountPath": "/tmp"
              }
            ]
          }
        ],
        "volumes": [
          {
            "name": "scratch",
            "emptyDir": {
              "sizeLimit": "5Gi"
            }
          }
        ]
      }
    }

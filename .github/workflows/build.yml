name: Build

on:
  schedule:
    - cron: "30 23 * * *"
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types:
      - labeled
      - opened
      - reopened
      - synchronize

jobs:
  setup:
    name: Setup
    runs-on: ubuntu-slim
    permissions:
      contents: read
      actions: read
      pull-requests: read
    outputs:
      python_tests_matrix: ${{ steps.versions.outputs.matrix }}
      python_tests_versions: ${{ steps.versions.outputs.versions }}
      python_tests_choices: ${{ steps.choices.outputs.choices }}
      python_tests_partial: ${{ github.event_name != 'schedule' }}
      build_package: ${{ github.event_name == 'schedule' || github.event_name == 'push' || steps.filter.outputs.package == 'true' || steps.baseline-workflow.outputs.workflow_run_id == '' }}
      baseline_run_id: ${{ steps.baseline-workflow.outputs.workflow_run_id }}
      run_spark_tests: ${{ ((github.event_name == 'pull_request' && (github.event.action == 'opened' || steps.message.outputs.run_spark_tests == 'true' || steps.label.outputs.run_spark_tests == 'true')) || github.event_name == 'push') && 'true' || 'false' }}
      run_ibis_tests: ${{ ((github.event_name == 'pull_request' && (github.event.action == 'opened' || steps.message.outputs.run_ibis_tests == 'true' || steps.label.outputs.run_ibis_tests == 'true')) || github.event_name == 'push') && 'true' || 'false' }}
    steps:
      - uses: actions/checkout@v7

      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            package:
              - ".github/**"
              - "crates/**"
              - "python/**"
              - "scripts/**"
              - "Cargo.lock"
              - "Cargo.toml"
              - "clippy.toml"
              - "pyproject.toml"
              - "rustfmt.toml"

      - uses: ./.github/actions/commit-baseline
        id: baseline

      - uses: ./.github/actions/commit-workflow
        id: baseline-workflow
        with:
          sha: ${{ steps.baseline.outputs.sha }}
          workflow_name: Build
          artifact_name: python-package

      - uses: actions/github-script@v9
        id: message
        with:
          script: |
            const { data: commit } = await github.rest.git.getCommit({
              owner: context.repo.owner,
              repo: context.repo.repo,
              // When the event is `pull_request`, we must extract the commit message from the head branch,
              // rather than the merge branch created by GitHub.
              commit_sha: context.payload.pull_request !== undefined ? context.payload.pull_request.head.sha : context.sha,
            });
            const patterns = [
                { name: 'run_spark_tests', pattern: "\\[(spark )?tests?\\]", flags: "i" },
                { name: 'run_ibis_tests', pattern: "\\[(ibis )?tests?\\]", flags: "i" },
            ];
            for (const p of patterns) {
                const regex = new RegExp(p.pattern, p.flags);
                core.setOutput(p.name, commit.message.match(regex) !== null ? 'true' : 'false');
            }

      - uses: actions/github-script@v9
        id: label
        with:
          script: |
            const labels = context.payload.pull_request?.labels?.map(label => label.name) || [];
            core.setOutput('run_spark_tests', labels.includes('run spark tests') ? 'true' : 'false');
            core.setOutput('run_ibis_tests', labels.includes('run ibis tests') ? 'true' : 'false');

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - uses: pypa/hatch@install

      - name: Verify report scripts
        run: node --test .github/scripts/*.test.cjs

      - name: Read PySpark versions
        id: versions
        run: |
          python - <<'PYTHON'
          import json
          import os
          import tomllib
          from pathlib import Path
          config = tomllib.loads(Path("pyproject.toml").read_text())
          versions = config["tool"]["hatch"]["envs"]["test"]["matrix"][0]["spark"]
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write(f"versions={json.dumps(versions)}\n")
              output.write(f"matrix={json.dumps({'spark_version': versions})}\n")
          with open(os.environ["GITHUB_ENV"], "a") as output:
              output.write(f"HATCH_ENV=test.spark-{versions[-1]}\n")
          PYTHON

      - name: Discover suites
        env:
          PYTHONPATH: ${{ github.workspace }}/python
          PYSAIL_TEST_SUITE_MANIFEST: python-test-suites.json
        run: |
          # Exit 5 means no tests were collected.
          hatch run pytest --collect-only -q --pyargs pysail.tests pysail.tests._dev || {
            status=$?
            test "$status" -eq 5
          }

      - name: Resolve suite choices
        uses: actions/github-script@v9
        id: choices
        with:
          script: |
            const { preparePythonTestSuites } = require('./.github/scripts/python-test-suites.cjs');
            const choices = await preparePythonTestSuites({
              github,
              context,
              runAttempt: Number(process.env.GITHUB_RUN_ATTEMPT),
            });
            core.setOutput('choices', JSON.stringify(choices));

      - uses: actions/upload-artifact@v7
        if: github.event_name == 'pull_request'
        with:
          name: python-test-report-${{ github.run_attempt }}
          path: python-test-report
          retention-days: 7

  rust-tests:
    name: Rust Tests
    if: ${{ github.event_name != 'schedule' && needs.setup.outputs.build_package == 'true' }}
    uses: ./.github/workflows/rust-tests.yml
    secrets:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
    needs:
      - setup

  rust-build:
    name: Rust Build
    if: ${{ needs.setup.outputs.build_package == 'true' }}
    uses: ./.github/workflows/rust-build.yml
    secrets:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
    needs:
      - setup

  spark-tests:
    name: Spark Tests
    if: ${{ github.event_name != 'schedule' && needs.setup.outputs.build_package == 'true' && needs.setup.outputs.run_spark_tests == 'true' }}
    uses: ./.github/workflows/spark-tests.yml
    secrets:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
    strategy:
      fail-fast: false
      matrix:
        spark-version: ["3.5.9", "4.2.0"]
    with:
      spark_version: ${{ matrix.spark-version }}
    needs:
      - setup
      - rust-build

  ibis-tests:
    name: Ibis Tests
    if: ${{ github.event_name != 'schedule' && needs.setup.outputs.build_package == 'true' && needs.setup.outputs.run_ibis_tests == 'true' }}
    uses: ./.github/workflows/ibis-tests.yml
    secrets:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
    needs:
      - setup
      - rust-build

  python-tests:
    name: Python Tests
    if: ${{ !failure() && !cancelled() && needs.setup.outputs.build_package == 'true' }}
    uses: ./.github/workflows/python-tests.yml
    secrets:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.setup.outputs.python_tests_matrix) }}
    with:
      spark_version: ${{ matrix.spark_version }}
      spark_versions: ${{ needs.setup.outputs.python_tests_versions }}
      suite_choices: ${{ needs.setup.outputs.python_tests_choices }}
      seed: ${{ github.event_name == 'pull_request' && format('pull/{0}', github.event.pull_request.number) || format('commit/{0}', github.sha) }}
      partial: ${{ fromJSON(needs.setup.outputs.python_tests_partial) }}
    needs:
      - setup
      - rust-build

  codecov-notify:
    name: Codecov Notify
    if: ${{ !cancelled() && github.actor != 'dependabot[bot]' }}
    runs-on: ubuntu-slim
    needs:
      - rust-tests
      - python-tests
      - spark-tests
      - ibis-tests
    env:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
    steps:
      - uses: actions/checkout@v7

      - name: Codecov
        uses: codecov/codecov-action@v7
        with:
          run_command: send-notifications
          token: ${{ env.CODECOV_TOKEN }}

  docs-build:
    name: Docs Build
    # We must specify an explicit condition so that the job still runs when the build is skipped.
    if: ${{ !failure() && !cancelled() && github.event_name != 'schedule' }}
    uses: ./.github/workflows/docs-build.yml
    needs:
      - setup
      - rust-tests
      - rust-build
    strategy:
      matrix:
        stage: ${{ fromJSON(github.event_name == 'push' && '["dev", "prod"]' || '["test"]') }}
    with:
      stage: ${{ matrix.stage }}
      version: main
      package_run_id: ${{ needs.setup.outputs.build_package == 'true' && github.run_id || needs.setup.outputs.baseline_run_id }}

  docs-deploy:
    name: Docs Deploy
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    uses: ./.github/workflows/docs-deploy.yml
    needs:
      - docs-build
    strategy:
      max-parallel: 1
      matrix:
        stage: [dev, prod]
    permissions:
      id-token: write
    with:
      stage: ${{ matrix.stage }}
      version: main

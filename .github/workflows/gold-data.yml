name: Gold Data

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  run:
    name: Run
    runs-on: ubuntu-slim
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v7

      - uses: $/.github/actions/commit-baseline
        id: baseline

      - uses: actions/checkout@v7
        with:
          path: tmp/baseline
          ref: ${{ steps.baseline.outputs.sha }}

      - name: Generate Gold Data Report
        env:
          REPORT_GIT_REF_BEFORE: ${{ steps.baseline.outputs.ref }}
          REPORT_GIT_REF_AFTER: ${{ github.ref }}
        run: |
          mkdir -p tmp/report
          scripts/common-gold-data/report.sh . tmp/baseline > tmp/report/report.md
          cat tmp/report/report.md >> "$GITHUB_STEP_SUMMARY"

      - uses: $/.github/actions/pull-request-prepare-report
        with:
          report_name: gold-data
          report_path: tmp/report/report.md

name: JDBC Integration Tests

on:
  workflow_call:

jobs:
  test:
    name: PostgreSQL / Spark 4.1.2 oracle
    runs-on: ubuntu-latest
    env:
      HATCH_ENV: "test.spark-4.1.1"
      SAIL_SPARK_4_1_2_PYTHON: ${{ github.workspace }}/.venvs/spark-4.1.2-oracle/bin/python
      # Fails the sentinel test (instead of silently skipping every differential)
      # if SAIL_SPARK_4_1_2_PYTHON ever stops resolving to a real oracle.
      SAIL_JDBC_REQUIRE_ORACLE: "1"
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install Hatch
        uses: pypa/hatch@install

      - name: Download Python Package
        uses: actions/download-artifact@v7
        with:
          name: python-package
          path: target/wheels

      - name: Set Up Sail and Spark Oracle
        run: |
          hatch run install-pysail
          python -m venv .venvs/spark-4.1.2-oracle
          "$SAIL_SPARK_4_1_2_PYTHON" -m pip install "pyspark==4.1.2"

      - name: Report JDBC Test Stack
        run: |
          "$SAIL_SPARK_4_1_2_PYTHON" -c "import pyspark; print('oracle pyspark', pyspark.__version__)"
          hatch run python -c "from importlib.metadata import version; [print(name, version(name)) for name in ('adbc-driver-postgresql', 'pymysql', 'pymssql', 'sqlalchemy', 'pyarrow')]"
          echo "PostgreSQL JDBC org.postgresql:postgresql:42.7.7"
          echo "MySQL JDBC com.mysql:mysql-connector-j:9.4.0"
          echo "SQL Server JDBC com.microsoft.sqlserver:mssql-jdbc:12.10.2.jre11"
          java -version

      - name: Run JDBC Integration Tests
        run: |
          hatch run pytest -m integration --pyargs \
            pysail.tests.spark.datasource.test_jdbc \
            pysail.tests.spark.datasource.test_jdbc_dialects \
            -v

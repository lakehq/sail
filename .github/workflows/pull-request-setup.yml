name: Pull Request Setup

on:
  pull_request_target:
    types:
      - opened
      - edited
      - reopened

jobs:
  setup:
    name: Setup
    runs-on: ubuntu-slim
    permissions:
      pull-requests: write
    steps:
      - name: Create Python test selection comment
        if: github.event.action == 'opened'
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: python-test-selection
          only_create: true
          message: |
            ### Python Test Selection

            If the build runs Python test discovery, the test suite list will appear here when the build finishes.
            Only builds that include Python tests publish the list.

      - name: Validate title
        if: ${{ !cancelled() }}
        uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            docs
            style
            refactor
            perf
            test
            build
            ci
            chore
            revert
            deps
          scopes: |
            cargo
            npm
          subjectPattern: "^(?![A-Z]).+$"
          subjectPatternError: |
            The subject "{subject}" in the pull request title does not match the configured pattern.
            Please ensure that the subject does not start with an uppercase letter.
            If the subject contains words that should start with an uppercase letter (e.g. "Rust"),
            consider rephrasing the subject so that such words are not at the start.

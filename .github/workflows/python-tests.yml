name: Python Tests

on:
  workflow_call:
    inputs:
      spark_version:
        description: The Spark version to test
        type: string
        required: true
      spark_versions:
        description: JSON array of PySpark versions in the matrix
        type: string
        required: true
      seed:
        description: Seed shared by all runners for deterministic test group assignment
        type: string
        required: true
      suite_choices:
        description: JSON array of enabled suite names
        type: string
        required: true
      partial:
        description: Whether this job belongs to a partial rather than full Python test run
        type: boolean
        required: true
    secrets:
      CODECOV_TOKEN:
        required: false

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    env:
      HATCH_ENV: "test.spark-${{ inputs.spark_version }}"
      PYSAIL_SOURCE_PATH: ${{ github.workspace }}/python/pysail
      PYSAIL_TEST_SEED: ${{ inputs.seed }}
      PYSAIL_TEST_SPARK_VERSIONS: ${{ inputs.spark_versions }}
      PYSAIL_TEST_SUITE_CHOICES: ${{ inputs.suite_choices }}
      # Coverage environment variables
      RUSTC_WORKSPACE_WRAPPER: ${{ github.workspace }}/.github/scripts/rustc-workspace-wrapper.sh
      LLVM_PROFILE_FILE: ${{ github.workspace }}/target/sail-python-${{ inputs.spark_version }}-%p-%m.profraw
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install Hatch
        uses: pypa/hatch@install

      - name: Install Rust toolchain and coverage tools
        run: |
          {
            rustup toolchain install stable
            rustup component add --toolchain stable llvm-tools-preview
          } &

      - name: Install grcov
        uses: taiki-e/install-action@grcov

      - name: Download Python Package
        uses: actions/download-artifact@v7
        with:
          name: python-package
          path: target/wheels

      - name: Set Up Hatch Environment
        run: |
          hatch run install-pysail

      - name: Install Kerberos client
        run: |
          sudo apt-get update
          sudo env DEBIAN_FRONTEND=noninteractive apt-get install --yes krb5-user

      - name: List Python packages
        continue-on-error: true
        run: |
          hatch run uv pip freeze || hatch run python -m pip freeze

      - name: Verify Package Version
        run: |
          declared_version="$(hatch version)"
          actual_version="$(hatch run python -c 'import pysail; print(pysail.__version__)')"
          echo "Declared version: $declared_version"
          echo "Actual version: $actual_version"
          if [ "$declared_version" != "$actual_version" ]; then
            echo "The declared version does not match the actual version."
            exit 1
          fi

      - name: Run Tests
        run: |
          # A version may have no assigned tests; pytest uses exit 5 for this case.
          hatch run pytest --pyargs pysail.tests pysail.tests._dev -v || {
            status=$?
            test "$status" -eq 5
          }

      # Generate coverage report after Python tests
      - name: Generate coverage report
        run: |
          # Wait for background Rust toolchain installation to complete
          wait
          BINARY_PATH=$(hatch run python -c 'import pysail._native; import os; print(os.path.dirname(pysail._native.__file__))')
          echo "Binary path: $BINARY_PATH"
          LLVM_PATH=$(.github/scripts/find-llvm-profdata.sh)
          grcov target --binary-path "$BINARY_PATH" -s . \
            --llvm-path "$LLVM_PATH" \
            -t lcov --branch --ignore-not-existing \
            -o coverage-python-${{ inputs.spark_version }}.info

      - name: Upload Python coverage to Codecov
        if: ${{ github.actor != 'dependabot[bot]' }}
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage-python-${{ inputs.spark_version }}.info
          flags: ${{ inputs.partial && 'python-partial-tests' || 'python-tests' }}
          name: ${{ inputs.partial && 'python-partial-tests' || 'python-tests' }}-${{ inputs.spark_version }}
          fail_ci_if_error: ${{ github.repository == 'lakehq/sail' }}
          env_vars: OS

name: Report

on:
  # When this workflow is triggered, the workflow definition comes from the `main` branch.
  # If a pull request modifies this file, it will have an effect only after the pull request is merged.
  workflow_run:
    workflows: ["Build", "Gold Data"]
    types:
      - completed

permissions:
  contents: read
  actions: read
  pull-requests: write

concurrency:
  group: report-${{ github.event.workflow_run.head_repository.full_name }}-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: false
  queue: max

jobs:
  report:
    name: Report
    if: github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-slim
    steps:
      - uses: $/.github/actions/pull-request-publish-report
        if: github.event.workflow_run.name == 'Build' && !cancelled()
        with:
          report_name: python-test-selection

      - uses: $/.github/actions/pull-request-publish-report
        if: github.event.workflow_run.name == 'Build' && !cancelled()
        with:
          report_name: spark-3.5.9-test

      - uses: $/.github/actions/pull-request-publish-report
        if: github.event.workflow_run.name == 'Build' && !cancelled()
        with:
          report_name: spark-4.3.0-test

      - uses: $/.github/actions/pull-request-publish-report
        if: github.event.workflow_run.name == 'Build' && !cancelled()
        with:
          report_name: ibis-test

      - uses: $/.github/actions/pull-request-publish-report
        if: github.event.workflow_run.name == 'Gold Data' && github.event.workflow_run.conclusion == 'success'
        with:
          report_name: gold-data

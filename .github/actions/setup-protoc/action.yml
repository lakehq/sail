name: Set up protoc
description: Install a pinned release of the Protocol Buffers compiler
inputs:
  version:
    description: Protobuf release version in major.minor format
    default: "35.0"
outputs:
  version:
    description: Installed Protobuf release version in major.minor format
    value: ${{ steps.install.outputs.version }}
runs:
  using: composite
  steps:
    - id: install
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        PROTOC_VERSION: ${{ inputs.version }}
      run: |
        if [[ ! "$PROTOC_VERSION" =~ ^[0-9]+\.[0-9]+$ ]]; then
          echo "::error::The protoc version must use major.minor format"
          exit 1
        fi

        case "$RUNNER_OS-$RUNNER_ARCH" in
          Linux-X64)   platform=linux-x86_64 ;;
          Linux-ARM64) platform=linux-aarch_64 ;;
          macOS-X64)   platform=osx-x86_64 ;;
          macOS-ARM64) platform=osx-aarch_64 ;;
          Windows-X64) platform=win64 ;;
          *)
            echo "::error::Unsupported protoc runner platform: $RUNNER_OS-$RUNNER_ARCH"
            exit 1
            ;;
        esac

        temp_dir="$RUNNER_TEMP"
        if [[ "$RUNNER_OS" == Windows ]]; then
          temp_dir="$(cygpath -u "$temp_dir")"
        fi
        install_dir="$(mktemp -d "$temp_dir/protoc.XXXXXX")"
        archive="protoc-$PROTOC_VERSION-$platform.zip"
        gh release download "v$PROTOC_VERSION" --repo protocolbuffers/protobuf \
          --pattern "$archive" --output - > "$install_dir/$archive"
        unzip -q "$install_dir/$archive" -d "$install_dir"
        rm "$install_dir/$archive"

        bin_dir="$install_dir/bin"
        if [[ "$RUNNER_OS" == Windows ]]; then
          bin_dir="$(cygpath -w "$bin_dir")"
        fi
        printf '%s\n' "$bin_dir" >> "$GITHUB_PATH"
        printf 'version=%s\n' "$PROTOC_VERSION" >> "$GITHUB_OUTPUT"

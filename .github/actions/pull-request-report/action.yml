name: Pull request report
description: Add a report as a comment to the pull request
inputs:
  workflow_run_id:
    description: The ID of the workflow run
    type: string
    required: true
  artifact_name:
    description: The artifact name for the report
    type: string
    required: true
  report_name:
    description: The name of the report used to distinguish pull request comments
    type: string
    required: true
runs:
  using: composite
  steps:
    - name: Download report
      id: download
      uses: actions/download-artifact@v7
      with:
        name: ${{ inputs.artifact_name }}
        run-id: ${{ inputs.workflow_run_id }}
        path: /tmp/report/${{ inputs.workflow_run_id }}/${{ inputs.artifact_name }}
        github-token: ${{ github.token }}

    - name: Get pull request number
      id: number
      uses: actions/github-script@v9
      env:
        REPORT_PATH: ${{ steps.download.outputs.download-path }}
        REPORT_NAME: ${{ inputs.report_name }}
        REPORT_SCRIPT: ${{ github.action_path }}/../../scripts/pull-request-report.cjs
      with:
        script: |
          const { validateReport } = require(process.env.REPORT_SCRIPT);
          const number = await validateReport({
            github,
            context,
            core,
            reportPath: process.env.REPORT_PATH,
            reportName: process.env.REPORT_NAME,
          });
          core.setOutput('value', number);

    - name: Publish report
      if: steps.number.outputs.value != ''
      uses: marocchino/sticky-pull-request-comment@v2
      with:
        header: ${{ inputs.report_name }}
        number: ${{ steps.number.outputs.value }}
        path: ${{ steps.download.outputs.download-path }}/report.md

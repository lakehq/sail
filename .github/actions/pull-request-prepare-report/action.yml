name: Prepare pull request report
description: Attach workflow metadata to a Markdown report and upload it
inputs:
  report_name:
    description: The name that identifies the report
    required: true
  report_path:
    description: The path to report.md
    required: true
  retention_days:
    description: The artifact retention period in days
    default: "1"
runs:
  using: composite
  steps:
    - name: Prepend report metadata
      if: github.event_name == 'pull_request'
      uses: actions/github-script@v9
      env:
        REPORT_NAME: ${{ inputs.report_name }}
        REPORT_PATH: ${{ inputs.report_path }}
      with:
        script: |
          const fs = require('node:fs');
          const { data: run } = await github.rest.actions.getWorkflowRun({
            ...context.repo,
            run_id: context.runId,
            exclude_pull_requests: true,
          });
          const metadata = {
            report: process.env.REPORT_NAME,
            pr: context.payload.pull_request.number,
            workflow_id: run.workflow_id,
            run_id: context.runId,
            run_number: context.runNumber,
            attempt: Number(process.env.GITHUB_RUN_ATTEMPT),
          };
          const path = process.env.REPORT_PATH;
          const body = fs.readFileSync(path, 'utf8');
          fs.writeFileSync(path, `<!-- sail-pull-request-report:v1 ${JSON.stringify(metadata)} -->\n${body}`);

    - name: Upload report
      uses: actions/upload-artifact@v7
      with:
        name: ${{ inputs.report_name }}-report
        path: ${{ inputs.report_path }}
        retention-days: ${{ inputs.retention_days }}
        if-no-files-found: error
        overwrite: true
